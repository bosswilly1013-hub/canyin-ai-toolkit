<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<link rel="stylesheet" href="/downloads/tool-frame.css">
<title>店面平面圖</title>
<style>
  body.tool { background: #eceae4; }
  .floor { display: grid; grid-template-columns: 280px minmax(0, 1fr) 260px; height: 100vh; }
  #lib, #info { overflow: auto; background: #f7f5f0; padding: 12px; font-size: 13px; }
  #lib button, .stage-bar button, #info button { border: 1px solid #e6e1d6; background: #fff; border-radius: 10px; padding: 6px 10px; cursor: pointer; }
  #lib button.on, .stage-bar button.on, button.lime { background: #d6ef4a; border-color: transparent; font-weight: 800; }
  .stage-wrap { position: relative; display: flex; flex-direction: column; min-width: 0; background:
    linear-gradient(#e4e0d6 1px, transparent 1px), linear-gradient(90deg, #e4e0d6 1px, transparent 1px);
    background-size: 24px 24px; background-color: #f3f1ea; }
  .stage-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; background: rgba(255,255,255,.92); border-bottom: 1px solid #e6e1d6; font-size: 16px; }
  .stage-bar button, #lib button, #info button { font-size: 15px; padding: 8px 12px; }
  #lib, #info { font-size: 15px; }
  .equip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 6px 0 10px; }
  .equip { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 72px; font-size: 14px; line-height: 1.2; }
  .equip svg { width: 22px; height: 22px; stroke: #1a1a16; fill: none; stroke-width: 1.6; }
  .equip small { color: #6d685f; font-size: 12px; }
  #stage { position: relative; flex: 1; overflow: auto; }
  svg { background: transparent; }
  .welcome { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(22,22,15,.28); z-index: 5; }
  .welcome.is-hidden { display: none !important; }
  .welcome .box { width: min(460px, 92%); background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 16px 40px rgba(0,0,0,.18); }
  .welcome li { margin: 8px 0; }
  .side-title { font-weight: 800; margin: 12px 0 6px; }
  @media (max-width: 900px) { .floor { grid-template-columns: 1fr; height: auto; } #stage { min-height: 70vh; } }
  @media print { .stage-bar, #lib, #info, .welcome { display: none; } }
</style>
<body class="tool">
<div class="floor">
  <aside id="lib"></aside>
  <div class="stage-wrap">
    <div class="stage-bar">
      <button type="button" id="undo">復原</button>
      <button type="button" id="redo">重做</button>
      <button type="button" id="tool-select" class="on">選取</button>
      <button type="button" id="tool-wall">畫牆</button>
      <button type="button" id="tool-measure">量尺寸</button>
      <button type="button" id="rect">方正店</button>
      <button type="button" id="lshape">L 型</button>
      <label>牆厚 <input id="thick" type="number" style="width:3.2rem"></label>
      <button type="button" id="check">走道檢查</button>
      <span style="flex:1"></span>
      <button type="button" id="blank">清空</button>
      <button type="button" id="demo">看範例</button>
      <button type="button" class="lime" id="png">輸出圖面</button>
      <select id="paper"><option>A4</option><option>A3</option></select>
      <label><input id="withlist" type="checkbox" checked> 含清單</label>
      <button type="button" id="csv">設備清單</button>
      <button type="button" id="json">存專案</button>
      <label>開專案 <input id="open" type="file" accept=".json"></label>
      <button type="button" id="print">列印</button>
    </div>
    <div id="stage"></div>
    <div class="welcome" id="welcome">
      <div class="box">
        <h2>開始畫這間店</h2>
        <ol>
          <li>用「畫牆」拉出店面，或按「方正店」直接給長寬。</li>
          <li>左邊點設備，放到平面上，再拖到對的位置。</li>
          <li>走道檢查看過之後，再輸出圖面。</li>
        </ol>
        <div class="actions">
          <button type="button" class="lime" id="welcome-demo">看範例</button>
          <button type="button" id="welcome-blank">從空白開始</button>
        </div>
        <p class="hint">圖只存在這台裝置。刪掉瀏覽器資料才會不見。</p>
      </div>
    </div>
  </div>
  <aside id="info"></aside>
</div>
<script src="/vendor/jiuwo-kit.js"></script>
<script>
const KEY = "jiuwo.tool.floor.v4";
const LIB = [
  ["冷藏","單門冰箱",60,60],["冷藏","雙門冰箱",90,70],["冷藏","四門冰箱",120,70],["冷藏","六門冰箱",180,75],["冷藏","工作台冰箱",150,70],["冷藏","沙拉櫃",120,70],["冷藏","冷藏展示櫃",120,60],["冷藏","冷凍櫃",150,70],["冷藏","製冰機",50,50],["冷藏","急凍櫃",80,70],
  ["熱廚","單口瓦斯爐",40,60],["熱廚","雙口炒台",90,75],["熱廚","三口炒台",150,80],["熱廚","平口爐",90,70],["熱廚","油炸機",40,60],["熱廚","雙槽油炸",80,60],["熱廚","蒸箱",70,70],["熱廚","烤箱",80,80],["熱廚","微波爐",50,40],["熱廚","煮飯機",40,40],["熱廚","湯爐",40,50],["熱廚","扒爐",90,70],
  ["備餐","工作台",120,60],["備餐","工作台",150,70],["備餐","工作台",180,70],["備餐","出餐台",160,70],["備餐","備餐台",180,70],["備餐","單槽水槽",60,60],["備餐","雙槽水槽",120,60],["備餐","三槽水槽",180,70],["備餐","洗手台",50,40],["備餐","洗碗機",60,60],["備餐","層架",90,40],["備餐","高層架",90,45],["備餐","調味台",80,60],
  ["座位","兩人桌",60,60],["座位","兩人桌",70,70],["座位","四人桌",120,70],["座位","四人桌",120,80],["座位","六人桌",180,80],["座位","八人桌",220,90],["座位","圓桌四人",90,90],["座位","圓桌六人",120,120],["座位","卡座",140,70],["座位","長桌",240,80],["座位","吧椅位",40,40],["座位","兒童椅位",40,40],
  ["吧台","吧台",180,60],["吧台","吧台",240,70],["吧台","POS",40,40],["吧台","收銀機",40,40],["吧台","飲料台",120,60],["吧台","咖啡機位",60,60],["吧台","點餐螢幕",40,20],["吧台","候位桌",80,40],
  ["門窗","單開門",90,12],["門窗","雙開門",140,12],["門窗","推拉門",180,12],["門窗","窗",120,10],["門窗","鐵捲門",240,15],["門窗","開口",100,10],
  ["固定","柱子",40,40],["固定","柱子",50,50],["固定","樓梯",120,250],["固定","廁所",140,160],["固定","管道間",60,60],["固定","排水溝",200,15],
  ["水電","給水",20,20],["水電","排水",20,20],["水電","瓦斯",20,20],["水電","110V",20,20],["水電","220V",20,20],["水電","排風",30,30],["水電","網路",20,20],["水電","燈",20,20],
  ["文字","文字",80,24]
];
const DEMO = {
  thick: 15, aisle: 90, tool: "select",
  poly: [[0,0],[1000,0],[1000,700],[0,700]],
  items: [
    { name: "出餐台", cat: "備餐", w: 160, h: 70, x: 40, y: 40, rot: 0 },
    { name: "四門冰箱", cat: "冷藏", w: 120, h: 70, x: 40, y: 220, rot: 0 },
    { name: "四人桌", cat: "座位", w: 120, h: 70, x: 420, y: 250, rot: 0 },
    { name: "單開門", cat: "門窗", w: 90, h: 20, x: 455, y: 680, rot: 0 },
    { name: "給水", cat: "水電", w: 20, h: 20, x: 820, y: 40, rot: 0 }
  ],
  selected: [], measures: []
};
let state = Object.assign(structuredClone(DEMO), Jiuwo.load(KEY, DEMO));
if (!state.poly) state = structuredClone(DEMO);
let past = [], future = [], drag = null, measureStart = null;
const scale = 0.55;
function snap() { past.push(JSON.stringify(state)); future = []; if (past.length > 40) past.shift(); }
function save() { Jiuwo.save(KEY, state); draw(); }
function shoelace(poly) {
  let a = 0;
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], q = poly[(i + 1) % poly.length];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return Math.abs(a) / 2;
}
function areaInfo() {
  const cm2 = shoelace(state.poly);
  const peri = state.poly.reduce((sum, p, i) => {
    const q = state.poly[(i + 1) % state.poly.length];
    return sum + Math.hypot(q[0] - p[0], q[1] - p[1]);
  }, 0);
  const inner = Math.max(0, cm2 - peri * state.thick / 2);
  return { m2: inner / 10000, ping: inner / 10000 / 3.3058, peri };
}
function inside(x, y) {
  let on = false;
  const poly = state.poly;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) on = !on;
  }
  return on;
}
function problems() {
  const notes = [];
  state.items.forEach((item, i) => {
    if (!inside(item.x + item.w / 2, item.y + item.h / 2) && item.cat !== "門窗") notes.push(item.name + "中心超出牆");
    state.items.slice(i + 1).forEach((other) => {
      const gapx = Math.max(0, Math.max(item.x, other.x) - Math.min(item.x + item.w, other.x + other.w));
      const gapy = Math.max(0, Math.max(item.y, other.y) - Math.min(item.y + item.h, other.y + other.h));
      if (gapx === 0 && gapy === 0) notes.push(item.name + "和" + other.name + "重疊");
      else if ((gapx === 0 || gapy === 0) && Math.max(gapx, gapy) < state.aisle && item.cat !== "水電" && other.cat !== "水電") notes.push(item.name + "和" + other.name + "走道 " + Math.round(Math.max(gapx, gapy)) + " 公分");
    });
  });
  return notes;
}
function toPx(cm) { return cm * scale; }
function draw() {
  const maxX = Math.max(...state.poly.map((p) => p[0]), ...state.items.map((item) => item.x + item.w), 400);
  const maxY = Math.max(...state.poly.map((p) => p[1]), ...state.items.map((item) => item.y + item.h), 300);
  const w = toPx(maxX + 40), h = toPx(maxY + 40);
  const pts = state.poly.map((p) => toPx(p[0]) + "," + toPx(p[1])).join(" ");
  const walls = state.poly.map((p, i) => {
    const q = state.poly[(i + 1) % state.poly.length];
    const len = Math.hypot(q[0] - p[0], q[1] - p[1]);
    return `<text x="${toPx((p[0]+q[0])/2)}" y="${toPx((p[1]+q[1])/2)}" font-size="11">${Math.round(len)}</text>`;
  }).join("");
  const boxes = state.items.map((item, index) => {
    const on = state.selected.includes(index);
    const rot = item.rot || 0;
    return `<g data-i="${index}" transform="translate(${toPx(item.x)} ${toPx(item.y)}) rotate(${rot} ${toPx(item.w)/2} ${toPx(item.h)/2})">
      <rect width="${toPx(item.w)}" height="${toPx(item.h)}" fill="${item.cat === "水電" ? "#d7ecff" : item.cat === "門窗" ? "#efe7d8" : "#fff6e8"}" stroke="${on ? "#e15a2b" : "#14221c"}" stroke-width="${on ? 2 : 1}"></rect>
      <text x="3" y="12" font-size="11">${item.name}</text></g>`;
  }).join("");
  const measures = (state.measures || []).map((m) => `<line x1="${toPx(m[0])}" y1="${toPx(m[1])}" x2="${toPx(m[2])}" y2="${toPx(m[3])}" stroke="#e15a2b"/><text x="${toPx((m[0]+m[2])/2)}" y="${toPx((m[1]+m[3])/2)}" font-size="12">${Math.round(Math.hypot(m[2]-m[0], m[3]-m[1]))} 公分</text>`).join("");
  document.getElementById("stage").innerHTML = `<svg id="plan" width="${w}" height="${h}"><polygon points="${pts}" fill="rgba(255,248,240,.35)" stroke="#e07a2f" stroke-width="3" stroke-dasharray="10 7"/>${walls}${boxes}${measures}</svg>`;
  document.getElementById("thick").value = state.thick;
  const info = areaInfo();
  const counts = {};
  state.items.forEach((item) => { counts[item.cat] = (counts[item.cat] || 0) + 1; });
  const selected = state.selected.map((index) => state.items[index]).filter(Boolean);
  document.getElementById("info").innerHTML = `<p>牆內面積 <b>${info.m2.toFixed(1)} ㎡</b>／<b>${info.ping.toFixed(2)} 坪</b></p><p>牆厚 ${state.thick} 公分，周長 ${Math.round(info.peri)} 公分</p>
    <p>${Object.entries(counts).map(([cat, n]) => cat + " " + n).join("、") || "還沒放設備"}</p>
    <h3>檢查</h3><ul>${problems().map((note) => `<li>${note}</li>`).join("") || "<li>沒有重疊或過窄走道。</li>"}</ul>
    ${selected.length === 1 ? `<h3>${selected[0].name}</h3>
      <label>名稱 <input id="nm" value="${selected[0].name}"></label>
      <label>寬 <input id="iw" type="number" value="${selected[0].w}"></label>
      <label>深 <input id="ih" type="number" value="${selected[0].h}"></label>
      <label>X <input id="ix" type="number" value="${selected[0].x}"></label>
      <label>Y <input id="iy" type="number" value="${selected[0].y}"></label>
      <button type="button" id="rotL">轉 -90</button> <button type="button" id="rotR">轉 +90</button>
      <button type="button" id="dup">複製</button> <button type="button" id="del">刪除</button>` : `<p>已選 ${selected.length} 件。Shift 再點可多選。方向鍵移動 1 公分。</p>`}`;
  const svg = document.getElementById("plan");
  svg.querySelectorAll("[data-i]").forEach((node) => node.onpointerdown = (event) => {
    if (state.tool !== "select") return;
    event.stopPropagation();
    const index = Number(node.dataset.i);
    if (event.shiftKey) state.selected = state.selected.includes(index) ? state.selected.filter((n) => n !== index) : state.selected.concat(index);
    else state.selected = [index];
    snap();
    drag = { index, x: event.clientX, y: event.clientY, origins: state.selected.map((n) => ({ n, x: state.items[n].x, y: state.items[n].y })) };
    draw();
  });
  svg.onpointerdown = (event) => {
    if (event.target !== svg && state.tool === "select") return;
    const rect = svg.getBoundingClientRect();
    const x = (event.clientX - rect.left) / scale, y = (event.clientY - rect.top) / scale;
    if (state.tool === "measure") {
      if (!measureStart) measureStart = [x, y];
      else { state.measures.push([measureStart[0], measureStart[1], x, y]); measureStart = null; save(); }
      return;
    }
    if (state.tool === "wall") drag = { wall: true, x1: x, y1: y };
  };
  if (selected.length === 1) {
    const item = state.items[state.selected[0]];
    ["nm","iw","ih","ix","iy"].forEach((id) => document.getElementById(id).onchange = () => {
      snap();
      item.name = document.getElementById("nm").value;
      item.w = Number(document.getElementById("iw").value);
      item.h = Number(document.getElementById("ih").value);
      item.x = Number(document.getElementById("ix").value);
      item.y = Number(document.getElementById("iy").value);
      save();
    });
    document.getElementById("rotL").onclick = () => rotate(-90);
    document.getElementById("rotR").onclick = () => rotate(90);
    document.getElementById("dup").onclick = () => duplicate();
    document.getElementById("del").onclick = () => { snap(); state.items.splice(state.selected[0], 1); state.selected = []; save(); };
  }
}
function rotate(delta) {
  snap();
  state.selected.forEach((index) => {
    const item = state.items[index];
    item.rot = ((item.rot || 0) + delta + 360) % 360;
    if (Math.abs(delta) === 90) { const w = item.w; item.w = item.h; item.h = w; }
  });
  save();
}
function duplicate() {
  snap();
  const copies = state.selected.map((index) => ({ ...state.items[index], x: state.items[index].x + 20, y: state.items[index].y + 20 }));
  state.items.push(...copies);
  state.selected = copies.map((_, i) => state.items.length - copies.length + i);
  save();
}
window.addEventListener("pointermove", (event) => {
  if (!drag || drag.wall || !drag.origins) return;
  const dx = (event.clientX - drag.x) / scale, dy = (event.clientY - drag.y) / scale;
  drag.origins.forEach((origin) => { state.items[origin.n].x = Math.round(origin.x + dx); state.items[origin.n].y = Math.round(origin.y + dy); });
});
window.addEventListener("pointerup", (event) => {
  if (drag && drag.wall) {
    const rect = document.getElementById("plan").getBoundingClientRect();
    const x2 = (event.clientX - rect.left) / scale, y2 = (event.clientY - rect.top) / scale;
    snap();
    state.poly.push([Math.round(x2), Math.round(y2)]);
    drag = null; save(); return;
  }
  if (drag) { drag = null; Jiuwo.save(KEY, state); }
});
function closeWelcome() { document.getElementById("welcome").classList.add("is-hidden"); }
document.getElementById("welcome").addEventListener("click", (event) => { if (event.target.id === "welcome") closeWelcome(); });
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") { closeWelcome(); return; }
  if (["INPUT","TEXTAREA","SELECT"].includes(event.target.tagName) || !state.selected.length) return;
  const step = event.shiftKey ? 10 : 1;
  const map = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (!map[event.key]) return;
  event.preventDefault();
  state.selected.forEach((index) => { state.items[index].x += map[event.key][0]; state.items[index].y += map[event.key][1]; });
  save();
});
const groups = {};
LIB.forEach((item, index) => { (groups[item[0]] = groups[item[0]] || []).push(index); });
const GLYPH = { "冷藏":"M5 4h14v16H5zM9 4v16", "熱廚":"M6 16c2-6 10-6 12 0M8 8h.1M12 6h.1M16 8h.1", "備餐":"M4 14h16M6 14V8h12v6", "座位":"M7 10h10v4H7zM6 14v4M18 14v4", "吧台":"M4 10h16v3H4zM7 13v5M17 13v5", "門窗":"M6 4h12v16H6zM12 4v16", "固定":"M8 8h8v8H8z", "水電":"M12 4v6M8 14a4 4 0 1 0 8 0c0-2-2-3-4-6", "文字":"M6 8h12M8 12h8M10 16h4" };
document.getElementById("lib").innerHTML = `<p class="side-title">空間</p><p class="hint">店名先寫在心裡。左邊點設備就放到圖上。</p><p class="side-title">畫出店面格局</p><button type="button" id="go-wall" class="lime">用拉線畫牆</button><p class="hint">橘虛線是牆。方正店直接填寬和深。</p><p class="side-title">設備 ${LIB.length} 項</p>` + Object.entries(groups).map(([cat, indexes]) => `<details open><summary>${cat} ${indexes.length}</summary><div class="equip-grid">${indexes.map((index) => `<button type="button" class="equip" data-lib="${index}"><svg viewBox="0 0 24 24"><path d="${GLYPH[cat] || "M5 5h14v14H5z"}"/></svg><span>${LIB[index][1]}</span><small>${LIB[index][2]}×${LIB[index][3]}</small></button>`).join("")}</div></details>`).join("") +
  `<h3>自訂</h3><input id="cname" placeholder="名稱"><input id="cw" type="number" placeholder="寬" style="width:3rem"><input id="ch" type="number" placeholder="深" style="width:3rem"><button type="button" id="cadd">放上平面圖</button>`;
document.querySelectorAll("[data-lib]").forEach((button) => button.onclick = () => {
  const spec = LIB[button.dataset.lib];
  snap();
  state.items.push({ name: spec[1], cat: spec[0], w: spec[2], h: spec[3], x: 30, y: 30, rot: 0 });
  state.selected = [state.items.length - 1];
  save();
});
document.getElementById("cadd").onclick = () => {
  snap();
  state.items.push({ name: document.getElementById("cname").value || "自訂", cat: "自訂", w: Number(document.getElementById("cw").value) || 80, h: Number(document.getElementById("ch").value) || 60, x: 30, y: 30, rot: 0 });
  state.selected = [state.items.length - 1];
  save();
};
function setTool(name) { state.tool = name; ["select","wall","measure"].forEach((id) => document.getElementById("tool-" + id).classList.toggle("on", id === name)); }
document.getElementById("tool-select").onclick = () => setTool("select");
document.getElementById("tool-wall").onclick = () => setTool("wall");
document.getElementById("tool-measure").onclick = () => { setTool("measure"); measureStart = null; };
document.getElementById("rect").onclick = () => {
  const w = Number(prompt("店寬（公分）", "900")) || 900;
  const d = Number(prompt("店深（公分）", "600")) || 600;
  snap(); state.poly = [[0,0],[w,0],[w,d],[0,d]]; save();
};
document.getElementById("lshape").onclick = () => {
  const W = Number(prompt("外寬", "1000")) || 1000;
  const D = Number(prompt("外深", "800")) || 800;
  const w = Number(prompt("缺角寬", "400")) || 400;
  const d = Number(prompt("缺角深", "300")) || 300;
  snap(); state.poly = [[0,0],[W,0],[W,D-d],[W-w,D-d],[W-w,D],[0,D]]; save();
};
document.getElementById("thick").onchange = (event) => { state.thick = Number(event.target.value) || 15; save(); };
document.getElementById("check").onclick = () => alert(problems().join("\n") || "走道和牆面目前看過關。");
document.getElementById("undo").onclick = () => { if (!past.length) return; future.push(JSON.stringify(state)); state = JSON.parse(past.pop()); save(); };
document.getElementById("redo").onclick = () => { if (!future.length) return; past.push(JSON.stringify(state)); state = JSON.parse(future.pop()); save(); };
document.getElementById("csv").onclick = () => Jiuwo.csv("設備清單.csv", [["分類","名稱","寬","深","X","Y","角度"], ...state.items.map((item) => [item.cat, item.name, item.w, item.h, item.x, item.y, item.rot || 0])]);
document.getElementById("json").onclick = () => { const blob = new Blob([JSON.stringify(state)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "平面圖.json"; a.click(); };
document.getElementById("open").onchange = async (event) => { state = JSON.parse(await event.target.files[0].text()); save(); };
document.getElementById("png").onclick = () => {
  const plan = document.getElementById("plan");
  const paper = document.getElementById("paper").value;
  const canvas = document.createElement("canvas");
  canvas.width = paper === "A3" ? 1400 : 1000;
  canvas.height = paper === "A3" ? 1900 : 1400;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const xml = new XMLSerializer().serializeToString(plan);
  const image = new Image();
  image.onload = () => {
    ctx.drawImage(image, 20, 20, canvas.width - 40, canvas.height * 0.62);
    if (document.getElementById("withlist").checked) {
      ctx.fillStyle = "#14221c"; ctx.font = "16px sans-serif";
      const info = areaInfo();
      ctx.fillText(`牆內 ${info.m2.toFixed(1)} ㎡ / ${info.ping.toFixed(2)} 坪　${paper}`, 24, canvas.height * 0.66);
      state.items.forEach((item, index) => ctx.fillText(`${index + 1}. ${item.cat} ${item.name} ${item.w}×${item.h}`, 24, canvas.height * 0.66 + 22 + index * 18));
    }
    const a = document.createElement("a"); a.href = canvas.toDataURL("image/png"); a.download = "平面圖-" + paper + ".png"; a.click();
  };
  image.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
};
document.getElementById("print").onclick = () => window.print();
document.getElementById("demo").onclick = () => { snap(); state = structuredClone(DEMO); save(); };
document.getElementById("blank").onclick = () => { snap(); state.items = []; state.measures = []; state.selected = []; save(); };
document.getElementById("go-wall").onclick = () => setTool("wall");
document.getElementById("welcome-demo").onclick = () => { closeWelcome(); document.getElementById("demo").click(); };
document.getElementById("welcome-blank").onclick = () => { closeWelcome(); document.getElementById("blank").click(); };
draw();
</script>
