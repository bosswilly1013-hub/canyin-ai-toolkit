<!doctype html>
<html lang="zh-Hant-TW">
<meta charset="utf-8">
<link rel="stylesheet" href="/downloads/tool-frame.css?v=4">
<title>商圈調查</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css?v=4">
<style>
  .area { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; margin-top: 14px; }
  .mapcard { background: #16160f; color: #fff; border-radius: 22px; padding: 14px; min-height: 78vh; display: flex; flex-direction: column; }
  .mapcard h2 { margin: 0 0 8px; font-size: 18px; }
  .filters { background: #fff; color: var(--ink); border-radius: 16px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filters button.on, #mode.on { background: var(--lime); color: #16160f; border-color: transparent; }
  #map { flex: 1; min-height: 520px; border-radius: 16px; margin-top: 8px; }
  #list { color: var(--ink); background: #fff; border-radius: 12px; margin-top: 8px; padding: 8px 10px; max-height: 140px; overflow: auto; font-size: 13px; }
  .help { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .help ol { padding-left: 1.2rem; }
  .pyr { display: grid; grid-template-columns: 1fr 52px 1fr; gap: 2px; align-items: center; font-size: 12px; }
  .pyr i { display: block; height: 8px; background: #1d3c34; }
  @media (max-width: 900px) { .area { grid-template-columns: 1fr; } #map { min-height: 360px; } .filters { align-items: stretch; } .filters input, .filters select, .filters button { min-height: 40px; } }
  @media print { .filters { display: none; } }
</style>
<body class="tool">
<div class="shell">
  <header class="hero">
    <p class="kicker">久沃實戰筆記</p>
    <h1>商圈調查</h1>
    <p>點一個位置，看走路幾分鐘內住了誰、附近有哪些店。人口用內政部村里資料。</p>
  </header>
  <div class="area">
    <section class="mapcard">
      <h2>商圈調查　全台村里</h2>
      <div class="filters">
        <button type="button" id="mode" class="on">步行圈</button>
        <label>縣市 <select id="city"></select></label>
        <label>鄉鎮 <select id="dist"></select></label>
        <span>範圍</span>
        <label><input type="radio" name="r" value="300">300</label>
        <label><input type="radio" name="r" value="500" checked>500</label>
        <label><input type="radio" name="r" value="800">800 公尺</label>
        <input id="q" aria-label="地標或地址" placeholder="里名、地標，例如高雄巨蛋">
        <button type="button" id="find">搜尋</button>
        <button type="button" id="add">加入比較</button>
        <select id="metric"><option value="p">人口</option><option value="h">戶數</option><option value="old">65歲以上占比</option></select>
        <select id="op"><option>≥</option><option>≤</option></select>
        <input id="limit" type="number" placeholder="門檻" style="width:5rem">
      </div>
      <div id="map"></div>
      <div id="list"></div>
    </section>
    <aside>
      <section class="help">
        <h2>先選一個想開店的位置</h2>
        <p>步行圈畫出來之後，看住了多少人、年齡，和附近有哪些店。</p>
        <ol>
          <li>搜尋地標，或直接拖地圖上的點。</li>
          <li>選 300、500 或 800 公尺。</li>
          <li>右邊數字是戶政人口，不是即時人潮。</li>
          <li>圓圈裡的超商會寫出店名。餐飲若暫時查不到，按再試一次就好。</li>
        </ol>
      </section>
      <section class="help" id="stats"><p>正在讀村里人口…</p></section>
    </aside>
  </div>
  <p id="src" class="hint"></p>
</div>
<p id="src" style="padding:8px 12px;font-size:12px"></p>
<script src="/vendor/leaflet/leaflet.js?v=4"></script>
<script>
L.Icon.Default.mergeOptions({
  iconUrl: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7",
  iconRetinaUrl: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7",
  shadowUrl: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
});
</script>
<script src="/vendor/jiuwo-kit.js?v=4"></script>
<script>
const KEY = "jiuwo.tool.district.v5";
const saved = Jiuwo.load(KEY, { lat: 22.639, lng: 120.302, radius: 500, label: "高雄車站", compare: [], mode: "walk", city: "高雄市", metric: "p" });
let data = null;
let center = { lat: saved.lat, lng: saved.lng, label: saved.label || "高雄車站" };
let radius = saved.radius || 500;
let places = [];
const map = L.map("map").setView([center.lat, center.lng], 14);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap" }).addTo(map);
const layer = L.layerGroup().addTo(map);
let circle = L.circle([center.lat, center.lng], { radius, color: "#e15a2b", weight: 2 }).addTo(map);
const pin = L.divIcon({ className: "pin", html: "●", iconSize: [18, 18] });
let marker = L.marker([center.lat, center.lng], { draggable: true, icon: pin }).addTo(map);

function ringBox(ring) {
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  ring.forEach((p) => { minx = Math.min(minx, p[0]); miny = Math.min(miny, p[1]); maxx = Math.max(maxx, p[0]); maxy = Math.max(maxy, p[1]); });
  return { minx, miny, maxx, maxy };
}
function inRing(lng, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / ((yj - yi) || 1e-12) + xi)) inside = !inside;
  }
  return inside;
}
function meters(a, b) { return Math.hypot((a.lat - b.lat) * 111000, (a.lng - b.lng) * 102000); }
function overlap(village) {
  const box = ringBox(village.r);
  const mid = { lat: (box.miny + box.maxy) / 2, lng: (box.minx + box.maxx) / 2 };
  if (meters(center, mid) > radius + 4000) return 0;
  let hit = 0, total = 0;
  for (let y = 0; y < 6; y++) for (let x = 0; x < 6; x++) {
    const lng = box.minx + (box.maxx - box.minx) * (x + 0.5) / 6;
    const lat = box.miny + (box.maxy - box.miny) * (y + 0.5) / 6;
    if (!inRing(lng, lat, village.r)) continue;
    total += 1;
    if (meters(center, { lat, lng }) <= radius) hit += 1;
  }
  return total ? hit / total : 0;
}
function walkStats() {
  const city = data.cities[saved.city] || Object.values(data.cities)[0];
  const rows = [];
  Object.entries(data.cities).forEach(([, pack]) => Object.entries(pack.districts).forEach(([dist, villages]) => villages.forEach((village) => {
    const share = overlap(village);
    if (share > 0.02) rows.push({ ...village, dist, share });
  })));
  const people = rows.reduce((sum, row) => sum + row.p * row.share, 0);
  const homes = rows.reduce((sum, row) => sum + row.h * row.share, 0);
  const age = [0,0,0,0,0];
  rows.forEach((row) => row.a.forEach((value, i) => { age[i] += value * row.share; }));
  return { rows, people, homes, age, cityAge: city.age, cityName: saved.city };
}
function pyramid(local, city) {
  const lt = local.reduce((a,b)=>a+b,0) || 1, ct = city.reduce((a,b)=>a+b,0) || 1;
  return data.bands.map((name, i) => `<div class="pyr"><i style="width:${local[i]/lt*100}%"></i><span>${name}</span><i style="width:${city[i]/ct*100}%;background:#c4a15a"></i></div>`).join("") + "<p>左：圈內。右：全市戶政年齡。</p>";
}
let placeNote = "正在向地圖查附近店家。";
let placeMode = "loading";
let placeTicket = 0;
let foodMiss = false;
function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function samplePlaces() {
  return [{ name: "示範麵館", kind: "餐飲", lat: center.lat + 0.002, lng: center.lng + 0.001, sample: true }, { name: "示範超商", kind: "超商", lat: center.lat - 0.001, lng: center.lng + 0.0015, sample: true }];
}
const CONV_RE = /7[\s-]*eleven|familymart|全家|萊爾富|hi[\s-]*life|ok\s*超商|okmart/i;
let convData = null;
let convPromise = null;
function loadConvData() {
  if (convData) return Promise.resolve(convData);
  if (!convPromise) {
    convPromise = fetch("/data/convenience-tw.json?v=4", { signal: AbortSignal.timeout(15000) }).then((response) => {
      if (!response.ok) throw new Error(String(response.status));
      return response.json();
    }).then((json) => {
      convData = json;
      return json;
    }).catch((error) => {
      convPromise = null;
      throw error;
    });
  }
  return convPromise;
}
function localConvenience() {
  const rows = convData && Array.isArray(convData.s) ? convData.s : [];
  const brands = convData && Array.isArray(convData.b) ? convData.b : ["其他", "7-ELEVEN", "全家", "萊爾富", "OK"];
  const cap = Number(radius) || 500;
  const found = [];
  for (const row of rows) {
    const lat = Number(row[0]);
    const lng = Number(row[1]);
    if (!Number.isFinite(lat) || !Number.isFinite(lng) || meters(center, { lat, lng }) > cap) continue;
    found.push({ name: row[3] || brands[row[2]] || "其他", kind: "超商", lat, lng });
  }
  return found;
}
function foodQuery() {
  const food = Math.min(800, Math.max(200, Number(radius) || 300));
  const lat = Number(center.lat).toFixed(6);
  const lng = Number(center.lng).toFixed(6);
  return `[out:json][timeout:12];(nwr["amenity"~"^(restaurant|cafe|fast_food)$"](around:${food},${lat},${lng}););out center 25;`;
}
function readShops(json) {
  const elements = json && Array.isArray(json.elements) ? json.elements : null;
  if (!elements) return null;
  return elements.filter((item) => item && item.tags && item.tags.name).map((item) => {
    const lat = item.lat || (item.center && item.center.lat);
    const lng = item.lon || (item.center && item.center.lon);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
    const blob = [item.tags.brand, item.tags.name, item.tags.operator].filter(Boolean).join(" ");
    const conv = item.tags.shop === "convenience" || item.tags.amenity === "convenience" || CONV_RE.test(blob);
    return { name: item.tags.name, kind: conv ? "超商" : "餐飲", lat, lng };
  }).filter(Boolean);
}
async function askMirror(url, query) {
  const encoded = "data=" + encodeURIComponent(query);
  let lastError = new Error("overpass");
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      let response = await fetch(url + "?" + encoded, { signal: AbortSignal.timeout(8000) });
      if (response.status === 405 || response.status === 406) {
        response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: encoded, signal: AbortSignal.timeout(8000) });
      }
      if (response.ok) return readShops(await response.json());
      lastError = new Error(String(response.status));
    } catch (error) {
      lastError = error;
    }
    if (attempt === 0) await new Promise((resolve) => setTimeout(resolve, 600));
  }
  throw lastError;
}
async function foodFromOverpass() {
  const query = foodQuery();
  const mirrors = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter", "https://overpass.private.coffee/api/interpreter"];
  const jobs = mirrors.map((url) => askMirror(url, query).catch(() => null));
  const rows = await Promise.race([
    Promise.all(jobs),
    new Promise((resolve) => setTimeout(() => resolve([]), 10000))
  ]);
  if (!Array.isArray(rows)) return [];
  return rows.find((list) => list && list.length) || [];
}
async function loadPlaces() {
  const ticket = ++placeTicket;
  const show = (list, note, mode) => {
    if (ticket !== placeTicket) return;
    places = list;
    placeNote = note;
    placeMode = mode;
    if (data && saved.mode !== "admin") drawWalk();
  };
  show([], "正在向地圖查附近店家。", "loading");
  foodMiss = false;
  let local = [];
  let localOk = false;
  try {
    await loadConvData();
    local = localConvenience();
    localOk = true;
  } catch (error) { localOk = false; }
  if (ticket !== placeTicket) return;
  if (localOk) show(local, "", "live");
  let food = [];
  try { food = await foodFromOverpass(); } catch (error) { food = []; }
  if (ticket !== placeTicket) return;
  if (!food.length) {
    try { food = await shopsFromNominatim(); } catch (error) { food = []; }
  }
  if (ticket !== placeTicket) return;
  let conv = local;
  if (!localOk) {
    try { conv = (await shopsFromNominatim(true)).filter((place) => place.kind === "超商"); } catch (error) { conv = []; }
  }
  const merged = mergePlaces(conv, food);
  if (merged.length) {
    foodMiss = food.length === 0;
    show(merged, "", "live");
    return;
  }
  if (localOk) {
    foodMiss = true;
    show([], "", "live");
    return;
  }
  foodMiss = false;
  show(samplePlaces(), "附近店家這次沒有連上。人口仍是戶政資料。", "sample");
}
async function retryFood() {
  const ticket = ++placeTicket;
  foodMiss = false;
  placeNote = "正在再查餐飲。";
  if (data && saved.mode !== "admin") drawWalk();
  let food = [];
  try { food = await foodFromOverpass(); } catch (error) { food = []; }
  if (ticket !== placeTicket) return;
  if (!food.length) {
    try { food = await shopsFromNominatim(); } catch (error) { food = []; }
  }
  if (ticket !== placeTicket) return;
  const conv = places.filter((place) => place.kind === "超商");
  places = mergePlaces(conv, food);
  foodMiss = food.length === 0;
  placeNote = "";
  placeMode = "live";
  if (data && saved.mode !== "admin") drawWalk();
}
function mergePlaces(a, b) {
  const seen = new Set();
  const out = [];
  for (const place of [...a, ...b]) {
    const key = place.kind + "@" + Number(place.lat).toFixed(4) + "," + Number(place.lng).toFixed(4);
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(place);
  }
  return out;
}
async function shopsFromNominatim(includeConvenience) {
  const span = 900;
  const dLat = span / 111000;
  const dLng = span / (111000 * Math.cos(Number(center.lat) * Math.PI / 180));
  const viewbox = [center.lng - dLng, Number(center.lat) + dLat, center.lng + dLng, Number(center.lat) - dLat].join(",");
  const jobs = [
    ["amenity=restaurant", "餐飲", 550],
    ["amenity=cafe", "餐飲", 550],
    ["amenity=fast_food", "餐飲", 550]
  ];
  if (includeConvenience) {
    jobs.unshift(
      ["q=" + encodeURIComponent("[shop=convenience]"), "超商", 1000],
      ["q=" + encodeURIComponent("7-ELEVEN"), "超商", 1000],
      ["q=" + encodeURIComponent("全家"), "超商", 1000],
      ["q=" + encodeURIComponent("萊爾富"), "超商", 1000],
      ["q=" + encodeURIComponent("OK超商"), "超商", 1000]
    );
  }
  const found = [];
  const seen = new Set();
  for (const [query, kind, limit] of jobs) {
    await new Promise((resolve) => setTimeout(resolve, 700));
    const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=12&countrycodes=tw&bounded=1&viewbox=" + viewbox + "&" + query;
    let response;
    try {
      response = await fetch(url, { headers: { Accept: "application/json" }, signal: AbortSignal.timeout(12000) });
    } catch (error) { continue; }
    if (!response.ok) continue;
    const rows = await response.json();
    if (!Array.isArray(rows)) continue;
    for (const item of rows) {
      const lat = Number(item.lat);
      const lng = Number(item.lon);
      const name = String(item.name || "").trim();
      if (!name || !Number.isFinite(lat) || !Number.isFinite(lng) || meters(center, { lat, lng }) > limit) continue;
      const conv = kind === "超商" || item.type === "convenience" || CONV_RE.test(name);
      const key = (conv ? "超商" : "餐飲") + "@" + lat.toFixed(4) + "," + lng.toFixed(4);
      if (seen.has(key)) continue;
      seen.add(key);
      found.push({ name, kind: conv ? "超商" : "餐飲", lat, lng });
    }
  }
  return found;
}
function drawWalk() {
  layer.clearLayers();
  circle.setLatLng([center.lat, center.lng]);
  circle.setRadius(radius);
  marker.setLatLng([center.lat, center.lng]);
  const stat = walkStats();
  stat.rows.slice(0, 40).forEach((row) => {
    const box = ringBox(row.r);
    L.polygon(row.r.map((p) => [p[1], p[0]]), { color: "#1d3c34", weight: 1, fillOpacity: 0.15 }).addTo(layer).bindPopup(row.dist + row.n + " " + row.p + "人");
  });
  places.forEach((place) => L.circleMarker([place.lat, place.lng], { radius: 4, color: place.kind === "超商" ? "#c4a15a" : "#e15a2b" }).addTo(layer).bindPopup(place.name));
  const area = Math.PI * radius * radius / 1e6;
  const shops = places.filter((place) => place.kind === "超商").length;
  document.getElementById("list").innerHTML = `<h3>圈到的里</h3>` + stat.rows.slice(0, 12).map((row) => `<p>${row.dist}${row.n} · ${Math.round(row.p * row.share)} 人 · 重疊 ${(row.share*100).toFixed(0)}%</p>`).join("");
  document.getElementById("stats").innerHTML = `<h2>${radius} 公尺</h2><p>${center.label || "這個地點"}</p><p>${center.lat.toFixed(3)}, ${center.lng.toFixed(3)}</p>
    <p>估算人口 <b>${Math.round(stat.people).toLocaleString()}</b></p>
    <p>戶數 ${Math.round(stat.homes).toLocaleString()}</p>
    <p>密度 ${area ? Math.round(stat.people / area).toLocaleString() : "—"} 人／平方公里</p>
    <p>${placeMode === "loading" ? "附近店家查詢中。" : shops ? "每家超商約服務 " + Math.round(stat.people / shops).toLocaleString() + " 人" : "這圈名單裡沒有超商，下面是餐飲。"}</p>
    <h3>年齡</h3>${pyramid(stat.age, stat.cityAge)}
    <h3>附近店家 ${places.length}</h3>${placeNote ? `<p>${esc(placeNote)}</p>` : ""}${foodMiss ? `<p>餐飲店家暫時查不到，稍後重試 <button type="button" id="retry-food">再試一次</button></p>` : ""}${places.slice(0, 8).map((place) => `<p>${esc(place.kind)} ${esc(place.name)}</p>`).join("")}
    <p>比較點 ${(saved.compare||[]).length} 個</p>`;
  const retry = document.getElementById("retry-food");
  if (retry) retry.onclick = () => { void retryFood(); };
  Jiuwo.save(KEY, { ...saved, lat: center.lat, lng: center.lng, radius, label: center.label });
}
function colorScale(value, max) { const t = max ? value / max : 0; return `hsl(${120 - t * 120}, 55%, 45%)`; }
function drawAdmin() {
  const city = data.cities[saved.city];
  const distName = document.getElementById("dist").value;
  const villages = distName && distName !== "全部" ? city.districts[distName].map((village) => ({ ...village, dist: distName })) : Object.entries(city.districts).flatMap(([dist, list]) => list.map((village) => ({ ...village, dist })));
  const metric = saved.metric || "p";
  const op = document.getElementById("op").value;
  const limit = Number(document.getElementById("limit").value);
  const valueOf = (village) => metric === "h" ? village.h : metric === "old" ? village.a[4] / (village.p || 1) : village.p;
  const shown = villages.filter((village) => !limit || (op === "≥" ? valueOf(village) >= limit : valueOf(village) <= limit));
  const max = Math.max(...shown.map(valueOf), 1);
  layer.clearLayers();
  shown.slice(0, 80).forEach((village) => L.polygon(village.r.map((p) => [p[1], p[0]]), { color: colorScale(valueOf(village), max), weight: 1, fillOpacity: 0.45 }).addTo(layer).bindPopup(`${village.dist}${village.n}<br>${village.p} 人 / ${village.h} 戶`));
  document.getElementById("list").innerHTML = `<p>篩到 ${shown.length} 個里</p>` + shown.slice(0, 15).map((village) => `<button type="button" data-go="${village.r[0][0]},${village.r[0][1]}">${village.dist}${village.n} ${village.p}</button>`).join("<br>");
  document.querySelectorAll("[data-go]").forEach((button) => button.onclick = () => { const [lng, lat] = button.dataset.go.split(",").map(Number); map.setView([lat, lng], 15); });
  document.getElementById("stats").innerHTML = `<h2>${saved.city}${distName && distName !== "全部" ? distName : ""}</h2><p>人口 ${city.p.toLocaleString()}，戶 ${city.h.toLocaleString()}</p><h3>全市年齡</h3>${pyramid(city.age, city.age)}`;
}
function fillCities() {
  const select = document.getElementById("city");
  select.innerHTML = Object.keys(data.cities).sort().map((name) => `<option ${name===saved.city?"selected":""}>${name}</option>`).join("");
  fillDist();
}
function fillDist() {
  const city = data.cities[saved.city];
  document.getElementById("dist").innerHTML = `<option>全部</option>` + Object.keys(city.districts).sort().map((name) => `<option>${name}</option>`).join("");
}
async function boot() {
  try {
    const response = await fetch("/downloads/villages.json?v=4");
    if (!response.ok) throw new Error(String(response.status));
    data = await response.json();
  } catch (error) {
    document.getElementById("stats").innerHTML = "<p>村里人口這次沒讀到。請檢查網路後重新整理。</p>";
    return;
  }
  document.getElementById("src").textContent = data.source + " 超商：OpenStreetMap 台灣便利商店名冊。餐飲：Overpass，失敗再查地名。地址：站內地名與 Nominatim。金門、連江沒有同版村里界。桃園升格後，舊界只對上部分區。";
  if (!data.cities[saved.city]) saved.city = "高雄市";
  fillCities();
  document.getElementById("city").onchange = (event) => { saved.city = event.target.value; fillDist(); if (saved.mode === "admin") drawAdmin(); else drawWalk(); };
  document.getElementById("dist").onchange = () => { if (saved.mode === "admin") drawAdmin(); };
  document.getElementById("metric").onchange = (event) => { saved.metric = event.target.value; if (saved.mode === "admin") drawAdmin(); };
  document.getElementById("op").onchange = () => { if (saved.mode === "admin") drawAdmin(); };
  document.getElementById("limit").onchange = () => { if (saved.mode === "admin") drawAdmin(); };
  placeMode = "loading";
  placeNote = "正在向地圖查附近店家。";
  if (saved.mode === "admin") drawAdmin(); else drawWalk();
  loadPlaces();
  setTimeout(() => map.invalidateSize(), 200);
}
document.getElementById("mode").onclick = () => {
  saved.mode = saved.mode === "walk" ? "admin" : "walk";
  document.getElementById("mode").textContent = saved.mode === "walk" ? "步行圈" : "看行政區";
  if (saved.mode === "admin") drawAdmin(); else drawWalk();
};
async function runSearch() {
  const queryText = document.getElementById("q").value.trim();
  if (!queryText) { alert("請先輸入地標或地址。"); return; }
  const known = (Jiuwo.places || []).find((place) => place[0] === queryText);
  const found = known ? { name: known[0], lat: known[1], lng: known[2] } : await Jiuwo.geocode(queryText);
  if (!found) { alert("找不到。可試高雄巨蛋、高雄車站、台北車站，或貼緯度,經度。"); return; }
  center = { lat: found.lat, lng: found.lng, label: found.name || queryText };
  saved.lat = center.lat; saved.lng = center.lng; saved.label = center.label;
  map.setView([center.lat, center.lng], 15);
  if (data) drawWalk();
  await loadPlaces();
  if (data) drawWalk();
}
document.getElementById("find").onclick = () => { void runSearch(); };
document.getElementById("q").addEventListener("keydown", (event) => { if (event.key === "Enter") { event.preventDefault(); void runSearch(); } });
marker.on("dragend", async () => { const p = marker.getLatLng(); center = { lat: p.lat, lng: p.lng, label: "拖曳的位置" }; await loadPlaces(); drawWalk(); });
document.querySelectorAll("input[name=r]").forEach((input) => { input.checked = Number(input.value) === radius; input.onchange = async () => { radius = Number(input.value); await loadPlaces(); drawWalk(); }; });
document.getElementById("add").onclick = () => { saved.compare = saved.compare || []; saved.compare.push({ ...center, radius, people: document.getElementById("stats").innerText.match(/估算人口\s+([\d,]+)/)?.[1] || "" }); drawWalk(); };
boot();
</script>
