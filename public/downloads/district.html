<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<link rel="stylesheet" href="/downloads/tool-skin.css">
<title>商圈調查</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
  body { margin: 0; font-family: sans-serif; background: #f6f3ec; color: #14221c; }
  header { background: #14221c; color: #fff; padding: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  main { display: grid; grid-template-columns: 300px 1fr 280px; }
  #map { min-height: 72vh; }
  aside { padding: 8px; overflow: auto; max-height: 78vh; font-size: 14px; }
  .pyr { display: grid; grid-template-columns: 1fr 52px 1fr; gap: 2px; align-items: center; font-size: 12px; }
  .pyr i { display: block; height: 8px; background: #1d3c34; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
<header>
  <b>久沃商圈</b>
  <button type="button" id="mode">步行圈</button>
  <input id="q" placeholder="地址或地標">
  <button type="button" id="find">搜尋</button>
  <label><input type="radio" name="r" value="300">300</label>
  <label><input type="radio" name="r" value="500" checked>500</label>
  <label><input type="radio" name="r" value="800">800 公尺</label>
  <button type="button" id="add">加入比較</button>
  <select id="city"></select>
  <select id="dist"></select>
  <select id="metric"><option value="p">人口</option><option value="h">戶數</option><option value="old">65歲以上占比</option></select>
  <select id="op"><option>≥</option><option>≤</option></select>
  <input id="limit" type="number" placeholder="門檻" style="width:5rem">
</header>
<main>
  <aside id="list"></aside>
  <div id="map"></div>
  <aside id="stats"><p>正在讀村里人口…</p></aside>
</main>
<p id="src" style="padding:8px 12px;font-size:12px"></p>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/vendor/jiuwo-kit.js"></script>
<script>
const KEY = "jiuwo.tool.district.v3";
const saved = Jiuwo.load(KEY, { lat: 22.639, lng: 120.302, radius: 500, label: "高雄車站", compare: [], mode: "walk", city: "高雄市", metric: "p" });
let data = null;
let center = { lat: saved.lat, lng: saved.lng, label: saved.label };
let radius = saved.radius || 500;
let places = [];
const map = L.map("map").setView([center.lat, center.lng], 14);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap" }).addTo(map);
const layer = L.layerGroup().addTo(map);
let circle = L.circle([center.lat, center.lng], { radius, color: "#e15a2b", weight: 2 }).addTo(map);
let marker = L.marker([center.lat, center.lng], { draggable: true }).addTo(map);

function ringBox(ring) {
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  ring.forEach((p) => { minx = Math.min(minx, p[0]); miny = Math.min(miny, p[1]); maxx = Math.max(maxx, p[0]); maxy = Math.max(maxy, p[1]); });
  return { minx, miny, maxx, maxy };
}
function inRing(lng, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / ((yj - yi) || 1e-12) + xi)) inside = !inside;
  }
  return inside;
}
function meters(a, b) { return Math.hypot((a.lat - b.lat) * 111000, (a.lng - b.lng) * 102000); }
function overlap(village) {
  const box = ringBox(village.r);
  const mid = { lat: (box.miny + box.maxy) / 2, lng: (box.minx + box.maxx) / 2 };
  if (meters(center, mid) > radius + 4000) return 0;
  let hit = 0, total = 0;
  for (let y = 0; y < 6; y++) for (let x = 0; x < 6; x++) {
    const lng = box.minx + (box.maxx - box.minx) * (x + 0.5) / 6;
    const lat = box.miny + (box.maxy - box.miny) * (y + 0.5) / 6;
    if (!inRing(lng, lat, village.r)) continue;
    total += 1;
    if (meters(center, { lat, lng }) <= radius) hit += 1;
  }
  return total ? hit / total : 0;
}
function walkStats() {
  const city = data.cities[saved.city] || Object.values(data.cities)[0];
  const rows = [];
  Object.entries(data.cities).forEach(([, pack]) => Object.entries(pack.districts).forEach(([dist, villages]) => villages.forEach((village) => {
    const share = overlap(village);
    if (share > 0.02) rows.push({ ...village, dist, share });
  })));
  const people = rows.reduce((sum, row) => sum + row.p * row.share, 0);
  const homes = rows.reduce((sum, row) => sum + row.h * row.share, 0);
  const age = [0,0,0,0,0];
  rows.forEach((row) => row.a.forEach((value, i) => { age[i] += value * row.share; }));
  return { rows, people, homes, age, cityAge: city.age, cityName: saved.city };
}
function pyramid(local, city) {
  const lt = local.reduce((a,b)=>a+b,0) || 1, ct = city.reduce((a,b)=>a+b,0) || 1;
  return data.bands.map((name, i) => `<div class="pyr"><i style="width:${local[i]/lt*100}%"></i><span>${name}</span><i style="width:${city[i]/ct*100}%;background:#c4a15a"></i></div>`).join("") + "<p>左：圈內。右：全市戶政年齡。</p>";
}
async function loadPlaces() {
  const fallback = [{ name: "示範麵館", kind: "餐飲", lat: center.lat + 0.002, lng: center.lng + 0.001 }, { name: "示範超商", kind: "超商", lat: center.lat - 0.001, lng: center.lng + 0.0015 }];
  try {
    const query = `[out:json][timeout:12];(node["amenity"~"restaurant|cafe|fast_food|convenience"](around:${radius},${center.lat},${center.lng}););out 30;`;
    const response = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: query, signal: AbortSignal.timeout(8000) });
    const json = await response.json();
    places = json.elements.filter((item) => item.tags && item.tags.name).map((item) => ({ name: item.tags.name, kind: item.tags.amenity === "convenience" ? "超商" : "餐飲", lat: item.lat, lng: item.lon }));
    if (!places.length) places = fallback;
  } catch (error) { places = fallback; }
}
function drawWalk() {
  layer.clearLayers();
  circle.setLatLng([center.lat, center.lng]);
  circle.setRadius(radius);
  marker.setLatLng([center.lat, center.lng]);
  const stat = walkStats();
  stat.rows.slice(0, 40).forEach((row) => {
    const box = ringBox(row.r);
    L.polygon(row.r.map((p) => [p[1], p[0]]), { color: "#1d3c34", weight: 1, fillOpacity: 0.15 }).addTo(layer).bindPopup(row.dist + row.n + " " + row.p + "人");
  });
  places.forEach((place) => L.circleMarker([place.lat, place.lng], { radius: 4, color: place.kind === "超商" ? "#c4a15a" : "#e15a2b" }).addTo(layer).bindPopup(place.name));
  const area = Math.PI * radius * radius / 1e6;
  const shops = places.filter((place) => place.kind === "超商").length;
  document.getElementById("list").innerHTML = `<h3>圈到的里</h3>` + stat.rows.slice(0, 12).map((row) => `<p>${row.dist}${row.n} · ${Math.round(row.p * row.share)} 人 · 重疊 ${(row.share*100).toFixed(0)}%</p>`).join("");
  document.getElementById("stats").innerHTML = `<h2>${radius} 公尺</h2><p>${center.label}</p>
    <p>估算人口 <b>${Math.round(stat.people).toLocaleString()}</b></p>
    <p>戶數 ${Math.round(stat.homes).toLocaleString()}</p>
    <p>密度 ${area ? Math.round(stat.people / area).toLocaleString() : "—"} 人／平方公里</p>
    <p>每家超商約服務 ${shops ? Math.round(stat.people / shops).toLocaleString() : "—"} 人</p>
    <h3>年齡</h3>${pyramid(stat.age, stat.cityAge)}
    <h3>OpenStreetMap 店家 ${places.length}</h3>${places.slice(0, 8).map((place) => `<p>${place.kind} ${place.name}</p>`).join("")}
    <p>比較點 ${(saved.compare||[]).length} 個</p>`;
  Jiuwo.save(KEY, { ...saved, lat: center.lat, lng: center.lng, radius, label: center.label });
}
function colorScale(value, max) { const t = max ? value / max : 0; return `hsl(${120 - t * 120}, 55%, 45%)`; }
function drawAdmin() {
  const city = data.cities[saved.city];
  const distName = document.getElementById("dist").value;
  const villages = distName && distName !== "全部" ? city.districts[distName].map((village) => ({ ...village, dist: distName })) : Object.entries(city.districts).flatMap(([dist, list]) => list.map((village) => ({ ...village, dist })));
  const metric = saved.metric || "p";
  const op = document.getElementById("op").value;
  const limit = Number(document.getElementById("limit").value);
  const valueOf = (village) => metric === "h" ? village.h : metric === "old" ? village.a[4] / (village.p || 1) : village.p;
  const shown = villages.filter((village) => !limit || (op === "≥" ? valueOf(village) >= limit : valueOf(village) <= limit));
  const max = Math.max(...shown.map(valueOf), 1);
  layer.clearLayers();
  shown.slice(0, 80).forEach((village) => L.polygon(village.r.map((p) => [p[1], p[0]]), { color: colorScale(valueOf(village), max), weight: 1, fillOpacity: 0.45 }).addTo(layer).bindPopup(`${village.dist}${village.n}<br>${village.p} 人 / ${village.h} 戶`));
  document.getElementById("list").innerHTML = `<p>篩到 ${shown.length} 個里</p>` + shown.slice(0, 15).map((village) => `<button type="button" data-go="${village.r[0][0]},${village.r[0][1]}">${village.dist}${village.n} ${village.p}</button>`).join("<br>");
  document.querySelectorAll("[data-go]").forEach((button) => button.onclick = () => { const [lng, lat] = button.dataset.go.split(",").map(Number); map.setView([lat, lng], 15); });
  document.getElementById("stats").innerHTML = `<h2>${saved.city}${distName && distName !== "全部" ? distName : ""}</h2><p>人口 ${city.p.toLocaleString()}，戶 ${city.h.toLocaleString()}</p><h3>全市年齡</h3>${pyramid(city.age, city.age)}`;
}
function fillCities() {
  const select = document.getElementById("city");
  select.innerHTML = Object.keys(data.cities).sort().map((name) => `<option ${name===saved.city?"selected":""}>${name}</option>`).join("");
  fillDist();
}
function fillDist() {
  const city = data.cities[saved.city];
  document.getElementById("dist").innerHTML = `<option>全部</option>` + Object.keys(city.districts).sort().map((name) => `<option>${name}</option>`).join("");
}
async function boot() {
  data = await (await fetch("/downloads/villages.json")).json();
  document.getElementById("src").textContent = data.source + " 店家：OpenStreetMap Overpass。地址：站內地名與 Nominatim。金門、連江沒有同版村里界。桃園升格後，舊界只對上部分區。";
  if (!data.cities[saved.city]) saved.city = "高雄市";
  fillCities();
  document.getElementById("city").onchange = (event) => { saved.city = event.target.value; fillDist(); if (saved.mode === "admin") drawAdmin(); else drawWalk(); };
  document.getElementById("dist").onchange = () => { if (saved.mode === "admin") drawAdmin(); };
  document.getElementById("metric").onchange = (event) => { saved.metric = event.target.value; if (saved.mode === "admin") drawAdmin(); };
  document.getElementById("op").onchange = () => { if (saved.mode === "admin") drawAdmin(); };
  document.getElementById("limit").onchange = () => { if (saved.mode === "admin") drawAdmin(); };
  if (saved.mode === "admin") drawAdmin(); else drawWalk();
  loadPlaces().then(() => { if (saved.mode !== "admin") drawWalk(); });
}
document.getElementById("mode").onclick = () => {
  saved.mode = saved.mode === "walk" ? "admin" : "walk";
  document.getElementById("mode").textContent = saved.mode === "walk" ? "步行圈" : "看行政區";
  if (saved.mode === "admin") drawAdmin(); else drawWalk();
};
document.getElementById("find").onclick = async () => {
  const found = await Jiuwo.geocode(document.getElementById("q").value);
  if (!found) { alert("找不到。可試高雄車站、台北車站，或貼緯度,經度。"); return; }
  center = found; map.setView([found.lat, found.lng], 15); await loadPlaces(); drawWalk();
};
marker.on("dragend", async () => { const p = marker.getLatLng(); center = { lat: p.lat, lng: p.lng, label: "拖曳的位置" }; await loadPlaces(); drawWalk(); });
document.querySelectorAll("input[name=r]").forEach((input) => { input.checked = Number(input.value) === radius; input.onchange = async () => { radius = Number(input.value); await loadPlaces(); drawWalk(); }; });
document.getElementById("add").onclick = () => { saved.compare = saved.compare || []; saved.compare.push({ ...center, radius, people: document.getElementById("stats").innerText.match(/估算人口\s+([\d,]+)/)?.[1] || "" }); drawWalk(); };
boot();
</script>
