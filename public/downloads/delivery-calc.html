<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>外送試算</title>
<body style="font-family:sans-serif;max-width:520px;margin:24px">
<h1>外送試算</h1>
<p>店內價、食材、抽成，算出要賣多少才留得住毛利。數字存在這台裝置。</p>
<label>店內價 <input id="price" type="number"></label>
<label>食材 <input id="cost" type="number"></label>
<label>抽成 % <input id="fee" type="number"></label>
<label>想留的毛利 % <input id="keep" type="number"></label>
<p id="out"></p>
<button id="clear" type="button">清空示範資料</button>
<script>
const KEY = "jiuwo.tool.delivery";
const demo = { price: 120, cost: 40, fee: 30, keep: 30 };
const ids = Object.keys(demo);
function read() { try { return { ...demo, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch { return { ...demo }; } }
function write() {
  const data = {};
  ids.forEach((id) => { data[id] = document.getElementById(id).value; });
  localStorage.setItem(KEY, JSON.stringify(data));
  const remain = 1 - Number(data.fee) / 100 - Number(data.keep) / 100;
  const need = remain > 0 ? Math.ceil(Number(data.cost) / remain) : 0;
  document.getElementById("out").textContent = remain <= 0
    ? "抽成加想留的毛利已經超過 100%，這道不適合上架。"
    : "外送價大約 " + need + " 元。店內價是 " + data.price + " 元。";
}
const saved = read();
ids.forEach((id) => { document.getElementById(id).value = saved[id]; document.getElementById(id).addEventListener("input", write); });
document.getElementById("clear").onclick = () => { localStorage.removeItem(KEY); ids.forEach((id) => { document.getElementById(id).value = demo[id]; }); write(); };
write();
</script>
