<!doctype html>
<html lang="zh-Hant-TW">
<meta charset="utf-8">
<link rel="stylesheet" href="/downloads/tool-skin.css">
<title>送貨路線</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
  body { margin: 0; font-family: sans-serif; color: #14221c; background: #f6f3ec; }
  header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: #14221c; color: #f4efe6; }
  header button, .tabs button, .bar button { border: 0; border-radius: 999px; padding: 6px 10px; }
  .tabs button.on { background: #e15a2b; color: #fff; }
  main { display: grid; grid-template-columns: 380px minmax(0, 1fr); height: calc(100vh - 108px); min-height: 560px; padding: 0 !important; }
  aside { padding: 12px; overflow: auto; background: #f6f3ec; }
  #map { height: 100%; min-height: 560px; width: 100%; }
  .leaflet-container { height: 100%; width: 100%; background: #d9e2d4; font: inherit; }
  .stepcard { background: #fff; border: 1px solid #e8e8e0; border-radius: 16px; padding: 12px; margin-bottom: 10px; }
  .days { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .day { border: 1px solid #e8e8e0; border-radius: 999px; padding: 4px 10px; background: #fff; }
  .day.on { background: #1A1A16; color: #C3F000; }
  #go { width: 100%; background: #C3F000; color: #1A1A16; font-weight: 800; border: 0; border-radius: 12px; padding: 12px; }
  .stop { display: flex; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid #e4ddd0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { border-bottom: 1px solid #e4ddd0; text-align: left; padding: 4px; }
  .pin { background: #e15a2b; color: #fff; border-radius: 50%; width: 22px; height: 22px; line-height: 22px; text-align: center; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } #map { min-height: 320px; } }
  @media print { header, .tabs, .bar { display: none; } }
</style>
<header>
  <b>久沃送貨路線</b>
  <span>勾今天要送的店，排出順序</span>
</header>
<div class="tabs" style="padding:8px 14px;display:flex;gap:6px">
  <button type="button" id="tab-plan" class="on">排路線</button>
  <button type="button" id="tab-shops">店家</button>
  <button type="button" id="tab-saved">已存的路線</button>
  <button type="button" id="tab-set">設定</button>
</div>
<main>
  <aside id="panel"></aside>
  <div id="map"></div>
</main>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/vendor/xlsx.full.min.js"></script>
<script src="/vendor/jiuwo-kit.js"></script>
<script>
function esc(text) { return String(text ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
const KEY = "jiuwo.tool.route.v2";
const DEMO = {
  warehouse: { name: "久沃中央廚房", address: "高雄車站", lat: 22.639, lng: 120.302 },
  drivers: ["阿德", "小陳"],
  shops: [
    { name: "河堤麵館", area: "鼓山", address: "高雄巨蛋", lat: 22.669, lng: 120.302, note: "10點後才收貨", open: true },
    { name: "港邊便當", area: "鹽埕", address: "鹽埕", lat: 22.622, lng: 120.281, note: "", open: true },
    { name: "田裡小館", area: "前金", address: "前金", lat: 22.627, lng: 120.292, note: "", open: true },
    { name: "灶口熱炒", area: "新興", address: "新興", lat: 22.631, lng: 120.312, note: "午休不收", open: true },
    { name: "市場鮮魚", area: "三民", address: "高雄車站", lat: 22.645, lng: 120.308, note: "", open: true },
    { name: "坡地麵店", area: "左營", address: "左營高鐵", lat: 22.687, lng: 120.308, note: "", open: true },
    { name: "青葉素食", area: "苓雅", address: "苓雅", lat: 22.621, lng: 120.318, note: "走後門", open: true },
    { name: "巷口廚房", area: "前鎮", address: "前鎮", lat: 22.605, lng: 120.318, note: "", open: true },
  ],
  saved: [],
};
let state = Jiuwo.load(KEY, DEMO);
if (!state.shops) state = structuredClone(DEMO);
let tab = "plan";
let day = "週一";
let driver = state.drivers[0] || "";
let back = true;
let picked = new Set(state.shops.map((shop) => shop.name));
let query = "";
let area = "全部";
let order = [];
const map = L.map("map").setView([state.warehouse.lat, state.warehouse.lng], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap" }).addTo(map);
const layer = L.layerGroup().addTo(map);

function km(a, b) {
  return Math.hypot((a.lat - b.lat) * 111, (a.lng - b.lng) * 102);
}
function nearest(points, ret) {
  const home = points[0];
  const rest = points.slice(1);
  const path = [home];
  let cur = home;
  while (rest.length) {
    rest.sort((a, b) => km(cur, a) - km(cur, b));
    cur = rest.shift();
    path.push(cur);
  }
  if (ret) path.push({ ...home, name: "回到" + home.name });
  return path;
}
function usable(point) { return point && Number.isFinite(Number(point.lat)) && Number.isFinite(Number(point.lng)); }
function pinIcon(label) { return L.divIcon({ className: "pin", html: String(label), iconSize: [28, 28], iconAnchor: [14, 14] }); }
async function buildRoute() {
  const home = { ...state.warehouse, home: true };
  const stops = state.shops.filter((shop) => picked.has(shop.name) && usable(shop) && shop.open !== false);
  if (!usable(home) || !stops.length) { alert("先勾至少一家有座標的店。"); return; }
  const seed = [home, ...stops];
  order = nearest(seed, back);
  const dist = order.slice(1).reduce((sum, point, index) => sum + km(order[index], point), 0);
  order.meta = { km: dist.toFixed(1), min: Math.round(dist / 25 * 60), line: null, note: "先用直線排出順序。" };
  draw();
  render();
  try {
    const coords = seed.map((point) => point.lng + "," + point.lat).join(";");
    const url = "https://router.project-osrm.org/trip/v1/driving/" + coords + "?source=first&roundtrip=" + (back ? "true" : "false") + "&geometries=geojson";
    const response = await fetch(url, { signal: AbortSignal.timeout(6000) });
    if (!response.ok) throw new Error("osrm");
    const data = await response.json();
    const trip = data.trips && data.trips[0];
    if (!trip) throw new Error("osrm");
    const seq = data.waypoints.map((point, index) => ({ index, order: point.waypoint_index })).sort((a, b) => a.order - b.order);
    order = seq.map((item) => seed[item.index]);
    if (back) order.push({ ...home, name: "回到" + home.name });
    order.meta = { km: (trip.distance / 1000).toFixed(1), min: Math.round(trip.duration / 60), line: trip.geometry, note: "" };
    draw();
    render();
  } catch (error) { /* 直線順序已經畫上 */ }
}
function draw() {
  layer.clearLayers();
  map.invalidateSize();
  const points = order.length ? order.filter(usable) : [state.warehouse, ...state.shops].filter(usable);
  if (!points.length) return;
  const latlngs = points.map((point) => [Number(point.lat), Number(point.lng)]);
  if (order.meta && order.meta.line) {
    try { L.geoJSON(order.meta.line, { style: { color: "#1d3c34", weight: 5 } }).addTo(layer); }
    catch (error) { L.polyline(latlngs, { color: "#e15a2b", weight: 4 }).addTo(layer); }
  } else if (order.length) L.polyline(latlngs, { color: "#e15a2b", weight: 4 }).addTo(layer);
  points.forEach((point, index) => {
    L.marker([Number(point.lat), Number(point.lng)], { icon: pinIcon(order.length ? index + 1 : "●") }).addTo(layer).bindPopup(point.name || "");
  });
  map.fitBounds(latlngs, { padding: [28, 28] });
}
function lineText() {
  return [day + "｜" + driver, ...order.map((point, index) => (index + 1) + ". " + point.name + (point.note ? "（" + point.note + "）" : ""))].join("\n");
}
function navLinks() {
  const chunks = [];
  for (let i = 0; i < order.length; i += 10) chunks.push(order.slice(i, i + 10));
  return chunks.map((chunk, index) => {
    const href = "https://www.google.com/maps/dir/" + chunk.map((point) => point.lat + "," + point.lng).join("/");
    return `<a href="${href}" target="_blank" rel="noreferrer">第 ${index + 1} 段導航（${chunk.length} 站）</a>`;
  }).join(" · ");
}
function render() {
  document.querySelectorAll(".tabs button").forEach((button) => button.classList.toggle("on", button.id === "tab-" + tab));
  const panel = document.getElementById("panel");
  if (tab === "plan") {
    const areas = ["全部", ...new Set(state.shops.map((shop) => shop.area))];
    const shown = state.shops.filter((shop) => (area === "全部" || shop.area === area) && shop.name.includes(query));
    panel.innerHTML = `
      <div class="stepcard"><b>1 哪一天、誰送</b>
      <div class="days">${["週一","週二","週三","週四","週五","週六","臨時"].map((item) => `<button type="button" class="day ${item===day?"on":""}" data-day="${item}">${item}</button>`).join("")}</div>
      <label>司機 <select id="driver">${state.drivers.map((item) => `<option ${item===driver?"selected":""}>${item}</option>`).join("")}</select></label>
      <p>起點：${state.warehouse.name}</p>
      <label><input id="back" type="checkbox" ${back?"checked":""}> 送完要回到出發地</label></div>
      <div class="stepcard"><b>2 勾要送的店</b>
      <input id="q" placeholder="搜尋店名 / 地址" value="${query}">
      <select id="area">${areas.map((item) => `<option ${item===area?"selected":""}>${item}</option>`).join("")}</select>
      <button type="button" id="all">這區全勾</button>
      <button type="button" id="none">清空勾選</button>
      <div>${shown.map((shop) => `<label class="stop"><input type="checkbox" data-shop="${shop.name}" ${picked.has(shop.name)?"checked":""}> ${shop.name} · ${shop.area} ${shop.note ? "· " + shop.note : ""} ${shop.lat ? "" : "缺・按我補"}</label>`).join("")}</div>
      <p class="bar"><button type="button" id="go">排路線</button></p></div>
      ${order.length ? `<div class="stepcard"><b>順序 ${order.length} 站</b> · ${order.meta.km} 公里 · 約 ${order.meta.min} 分<p>${order.meta.note || ""}</p>` + order.map((point, index) => `<div class="stop">${index+1}. ${point.name} <button type="button" data-up="${index}">▲</button><button type="button" data-down="${index}">▼</button></div>`).join("") + `<p>${navLinks()}</p><button type="button" id="copy">複製給 LINE</button> <button type="button" id="keep">存成固定路線</button> <button type="button" id="wipe">清掉重排</button></div>` : ""}`;
    panel.querySelectorAll("[data-shop]").forEach((box) => box.onchange = () => { box.checked ? picked.add(box.dataset.shop) : picked.delete(box.dataset.shop); });
    panel.querySelectorAll("[data-day]").forEach((button) => button.onclick = () => { day = button.dataset.day; render(); });
    panel.querySelector("#driver").onchange = (event) => { driver = event.target.value; };
    panel.querySelector("#back").onchange = (event) => { back = event.target.checked; };
    panel.querySelector("#q").onchange = (event) => { query = event.target.value; render(); };
    panel.querySelector("#area").onchange = (event) => { area = event.target.value; render(); };
    panel.querySelector("#all").onclick = () => { shown.forEach((shop) => picked.add(shop.name)); render(); };
    panel.querySelector("#none").onclick = () => { picked.clear(); render(); };
    const go = panel.querySelector("#go");
    if (go) go.onclick = () => buildRoute();
    panel.querySelectorAll("[data-up]").forEach((button) => button.onclick = () => move(Number(button.dataset.up), -1));
    panel.querySelectorAll("[data-down]").forEach((button) => button.onclick = () => move(Number(button.dataset.down), 1));
    const copy = panel.querySelector("#copy");
    if (copy) copy.onclick = async () => { await Jiuwo.copy(lineText()); copy.textContent = "已複製"; };
    const keep = panel.querySelector("#keep");
    if (keep) keep.onclick = () => {
      const name = prompt("路線名稱", day + "｜" + driver) || (day + "｜" + driver);
      state.saved.push({ name, day, driver, stops: order.map((point) => point.name) });
      Jiuwo.save(KEY, state);
    };
    const wipe = panel.querySelector("#wipe");
    if (wipe) wipe.onclick = () => { order = []; render(); };
  } else if (tab === "shops") {
    panel.innerHTML = `<table><tr><th>店名</th><th>區域</th><th>備註</th></tr>${state.shops.map((shop, index) => `<tr><td>${esc(shop.name)}</td><td>${esc(shop.area)}</td><td>${esc(shop.note || "")} ${shop.lat ? "" : "缺・按我補"} <button type="button" data-edit="${index}">改</button> <button type="button" data-del="${index}">刪</button></td></tr>`).join("")}</table>
      <p>店名 <input id="n"> 區域 <input id="a"> 地址或座標 <input id="addr"> 備註 <input id="note"></p>
      <button type="button" id="add">新增</button>
      <button type="button" id="tpl">下載 Excel 範本</button>
      <button type="button" id="exp">匯出</button>
      <label>匯入 <input id="imp" type="file" accept=".xlsx,.csv"></label>`;
    panel.querySelector("#add").onclick = async () => {
      const name = panel.querySelector("#n").value.trim();
      const address = panel.querySelector("#addr").value.trim();
      if (!name && !address) { alert("請先寫店名或地址。"); return; }
      const found = await Jiuwo.geocode(address);
      state.shops.push({ name: name || "新店", area: panel.querySelector("#a").value || "未分區", address, lat: found ? found.lat : null, lng: found ? found.lng : null, note: panel.querySelector("#note").value, open: true });
      Jiuwo.save(KEY, state); render();
    };
    panel.querySelectorAll("[data-del]").forEach((button) => button.onclick = () => {
      if (!confirm("刪掉這家店？")) return;
      state.shops.splice(Number(button.dataset.del), 1);
      Jiuwo.save(KEY, state); render();
    });
    panel.querySelectorAll("[data-edit]").forEach((button) => button.onclick = async () => {
      const shop = state.shops[Number(button.dataset.edit)];
      const address = prompt("地址或緯度,經度", shop.address || "");
      if (!address) return;
      const found = await Jiuwo.geocode(address);
      shop.address = address;
      if (found) { shop.lat = found.lat; shop.lng = found.lng; }
      Jiuwo.save(KEY, state); render();
    });
    panel.querySelector("#tpl").onclick = () => Jiuwo.xlsx("店家範本.xlsx", [["店名","區域","地址","緯度","經度","備註"]]);
    panel.querySelector("#exp").onclick = () => Jiuwo.xlsx("店家.xlsx", [["店名","區域","地址","緯度","經度","備註"], ...state.shops.map((shop) => [shop.name, shop.area, shop.address, shop.lat, shop.lng, shop.note])]);
    panel.querySelector("#imp").onchange = async (event) => {
      const file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file) return;
      let rows;
      try { rows = await Jiuwo.read(file); } catch (error) { alert("這份表格讀不起來。請用範本的欄位。"); return; }
      if (!rows || !rows.length) { alert("表格是空的。"); return; }
      const mode = confirm("確定＝取代現有店家，取消＝附加") ? "replace" : "append";
      const next = rows.slice(1).filter((row) => row[0]).map((row) => ({ name: row[0], area: row[1] || "未分區", address: row[2] || "", lat: Number(row[3]) || null, lng: Number(row[4]) || null, note: row[5] || "", open: true }));
      state.shops = mode === "replace" ? next : state.shops.concat(next);
      Jiuwo.save(KEY, state); render();
    };
  } else if (tab === "saved") {
    panel.innerHTML = state.saved.map((item, index) => `<p><b>${item.name}</b><br><button type="button" data-open="${index}">叫出來改</button> <button type="button" data-line="${index}">LINE 文字</button> <button type="button" data-del="${index}">刪除</button></p>`).join("") || "<p>還沒有存路線。</p>";
    panel.querySelectorAll("[data-open]").forEach((button) => button.onclick = () => {
      const item = state.saved[Number(button.dataset.open)];
      picked = new Set(item.stops);
      day = item.day; driver = item.driver; tab = "plan"; buildRoute();
    });
    panel.querySelectorAll("[data-line]").forEach((button) => button.onclick = () => Jiuwo.copy(state.saved[Number(button.dataset.line)].stops.join("\n")));
    panel.querySelectorAll("[data-del]").forEach((button) => button.onclick = () => { state.saved.splice(Number(button.dataset.del), 1); Jiuwo.save(KEY, state); render(); });
  } else {
    panel.innerHTML = `<p>倉庫 <input id="wname" value="${state.warehouse.name}"> <input id="waddr" value="${state.warehouse.address || ""}"></p>
      <button type="button" id="wsave">用地址找倉庫</button>
      <p>司機 <input id="dnew"> <button type="button" id="dadd">加司機</button></p>
      <ul>${state.drivers.map((name, index) => `<li>${name} <button type="button" data-dd="${index}">刪</button></li>`).join("")}</ul>
      <button type="button" id="backup">下載備份</button>
      <label>從備份還原 <input id="restore" type="file" accept=".json"></label>
      <button type="button" id="empty">全部清空</button>
      <button type="button" id="demo">還原範例店家</button>`;
    panel.querySelector("#wsave").onclick = async () => {
      const found = await Jiuwo.geocode(panel.querySelector("#waddr").value);
      state.warehouse.name = panel.querySelector("#wname").value || state.warehouse.name;
      state.warehouse.address = panel.querySelector("#waddr").value;
      if (found) { state.warehouse.lat = found.lat; state.warehouse.lng = found.lng; }
      Jiuwo.save(KEY, state); alert(found ? "倉庫已對到" + found.source : "找不到，請改貼緯度,經度");
    };
    panel.querySelector("#dadd").onclick = () => { const name = panel.querySelector("#dnew").value.trim(); if (name) state.drivers.push(name); Jiuwo.save(KEY, state); render(); };
    panel.querySelectorAll("[data-dd]").forEach((button) => button.onclick = () => { state.drivers.splice(Number(button.dataset.dd), 1); Jiuwo.save(KEY, state); render(); });
    panel.querySelector("#backup").onclick = () => { const blob = new Blob([JSON.stringify(state)], { type: "application/json" }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "路線備份.json"; link.click(); };
    panel.querySelector("#restore").onchange = async (event) => {
      const file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file) return;
      try {
        const next = JSON.parse(await file.text());
        if (!next || !Array.isArray(next.shops)) throw new Error("bad");
        state = next;
        Jiuwo.save(KEY, state);
        render();
      } catch (error) {
        alert("這份備份讀不起來。請選先前下載的路線備份。");
      }
    };
    panel.querySelector("#empty").onclick = () => { if (!confirm("清掉全部店家和路線？")) return; state = { warehouse: state.warehouse, drivers: [], shops: [], saved: [] }; Jiuwo.save(KEY, state); render(); };
    panel.querySelector("#demo").onclick = () => { Jiuwo.clear(KEY); state = structuredClone(DEMO); picked = new Set(state.shops.map((shop) => shop.name)); render(); };
  }
}
function move(index, delta) {
  const next = index + delta;
  if (next < 0 || next >= order.length) return;
  const item = order.splice(index, 1)[0];
  order.splice(next, 0, item);
  draw();
  render();
}
document.getElementById("tab-plan").onclick = () => { tab = "plan"; render(); };
document.getElementById("tab-shops").onclick = () => { tab = "shops"; render(); };
document.getElementById("tab-saved").onclick = () => { tab = "saved"; render(); };
document.getElementById("tab-set").onclick = () => { tab = "set"; render(); };
map.on("click", (event) => {
  if (tab !== "set") return;
  state.warehouse.lat = event.latlng.lat;
  state.warehouse.lng = event.latlng.lng;
  Jiuwo.save(KEY, state);
});
state.shops.forEach((shop) => {
  if (usable(shop)) return;
  const demo = DEMO.shops.find((item) => item.name === shop.name);
  if (demo) { shop.lat = demo.lat; shop.lng = demo.lng; }
});
if (!usable(state.warehouse)) { state.warehouse.lat = DEMO.warehouse.lat; state.warehouse.lng = DEMO.warehouse.lng; }
render();
setTimeout(() => { map.invalidateSize(); draw(); }, 250);
</script>
