<!doctype html>
<html lang="zh-Hant-TW">
<meta charset="utf-8">
<link rel="stylesheet" href="/downloads/tool-skin.css">
<title>食材比</title>
<style>label{display:block;margin:12px 0;font-size:1.05rem}input{width:min(100%,320px);height:40px}</style>
<header><b>一道菜的食材比</b></header>
<main>
<h1>一道菜的食材比</h1>
<p>成本除以售價。存在這台裝置。</p>
<label>菜名 <input id="name"></label>
<label>售價 <input id="price" type="number"></label>
<label>食材成本 <input id="cost" type="number"></label>
<p id="out"></p>
<button id="clear" type="button">清空數字</button>
<button id="demo" type="button">看一個例子</button>
</main>
<script>
const KEY = "jiuwo.tool.food-cost";
const demo = { name: "紅燒牛肉麵", price: 180, cost: 58 };
const ids = Object.keys(demo);
function read() { try { return { ...demo, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch { return { ...demo }; } }
function write() {
  const data = {};
  ids.forEach((id) => { data[id] = document.getElementById(id).value; });
  localStorage.setItem(KEY, JSON.stringify(data));
  const price = Number(data.price);
  const cost = Number(data.cost);
  const out = document.getElementById("out");
  if (!data.name && !data.price && !data.cost) { out.textContent = "先寫菜名、售價和食材成本。"; return; }
  if (!(price > 0) || !(cost >= 0) || !Number.isFinite(price) || !Number.isFinite(cost)) { out.textContent = "售價請填大於 0 的數字，成本請填 0 或正數。"; return; }
  const ratio = cost / price;
  const pct = Math.round(ratio * 1000) / 10;
  out.textContent = (data.name || "這道菜") + " 食材比 " + pct + "%。" + (pct > 35 ? "超過 35%，先查份量或進價。" : "");
}
const saved = read();
ids.forEach((id) => { document.getElementById(id).value = saved[id]; document.getElementById(id).addEventListener("input", write); });
document.getElementById("clear").onclick = () => { localStorage.removeItem(KEY); ids.forEach((id) => { document.getElementById(id).value = ""; }); write(); };
document.getElementById("demo").onclick = () => { ids.forEach((id) => { document.getElementById(id).value = demo[id]; }); write(); };
write();
</script>
