<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<link rel="stylesheet" href="/downloads/tool-frame.css">
<title>每月報表</title>
<style>
  .report { background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin-top: 14px; }
  .report h2 { margin: 0 0 6px; }
  #months button, #tabs button, .report .actions button { border-radius: 10px; }
  #months button.on, #tabs button.on { background: var(--lime); color: #16160f; border-color: transparent; }
  .kpi { display: grid; grid-template-columns: 1.3fr repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .kpi div { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .kpi div:first-child { background: #16160f; color: #fff; }
  .kpi b { display: block; font-size: 26px; }
  #body { overflow: auto; }
  #body table input { width: 4.6rem; }
  .bar { fill: #1d3c34; } .low { fill: #c4473a; }
  thead, #body tr:first-child { }
</style>
<body class="tool">
<div class="shell">
  <header class="hero">
    <p class="kicker">久沃實戰筆記｜開店、開公司都用得上</p>
    <h1>門市報表</h1>
    <p>每天打一行日記帳。月底用同一張表看損益。數字只存在這台裝置。</p>
  </header>
  <section class="report">
    <div class="grid2">
      <label class="f">店名<input id="shop" placeholder="店名"></label>
      <label class="f">年度（西元）<input id="year" type="number"></label>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="exp">匯出 Excel</button>
      <label>匯入 Excel <input id="imp" type="file" accept=".xlsx,.csv"></label>
      <button type="button" id="tpl">下載空白範本</button>
      <button type="button" id="print">列印／存 PDF</button>
      <button type="button" id="clear">數字全部清空</button>
      <button type="button" id="demo">還原成範例</button>
      <button type="button" id="mode">門市版</button>
      <span id="note"></span>
    </div>
    <div class="pills" id="months"></div>
    <div class="pills" id="tabs"></div>
    <div class="kpi" id="kpi"></div>
    <div id="body"></div>
  </section>
</div>
<script src="/vendor/xlsx.full.min.js"></script>
<script src="/vendor/jiuwo-kit.js"></script>
<script>
const KEY = "jiuwo.tool.report.v3";
function blankDay() { return { dine: 0, delivery: 0, guests: 0, buy: 0, cashExp: 0, otherIn: 0, otherOut: 0, register: 0 }; }
function blankMonth(seed) {
  return {
    target: 900000,
    days: Array.from({ length: 31 }, (_, i) => seed ? { dine: 28000 + (i % 5) * 800, delivery: 6000, guests: 90, buy: i % 3 === 0 ? 8000 : 0, cashExp: 500, otherIn: 0, otherOut: 0, register: 27500 + (i % 5) * 800 } : blankDay()),
    waste: seed ? [{ item: "青菜", reason: "進太多", qty: 2, amount: 400 }] : [],
    company: { revenue: 1200000, discount: 20000, begin: 80000, buy: 380000, returns: 8000, end: 90000, variable: [{ name: "包材", amount: 24000 }], fixed: [{ name: "房租", amount: 60000 }, { name: "人事", amount: 240000 }], other: 4000, taxRate: 20 }
  };
}
const DEMO = { mode: "store", shop: "久沃示範店", year: 2026, month: 1, tab: "journal", months: Array.from({ length: 12 }, (_, i) => blankMonth(i < 3)) };
let state = Jiuwo.load(KEY, DEMO);
if (!state.months || !state.months[0].days) state = structuredClone(DEMO);
const cur = () => state.months[state.month - 1];
const prev = () => state.months[state.month - 2] || cur();
function sum(month, key) { return month.days.reduce((total, day) => total + Number(day[key] || 0), 0); }
function cash(day) { const expect = Number(day.dine) + Number(day.otherIn) - Number(day.cashExp) - Number(day.otherOut); return { expect, diff: Number(day.register) - expect }; }
function active(day) { return ["dine","delivery","guests","buy","cashExp","register"].some((key) => Number(day[key])); }
function storePL(month) {
  const sales = sum(month, "dine") + sum(month, "delivery");
  const cogs = sum(month, "buy");
  const fixed = sum(month, "cashExp") + month.days.reduce((t, day) => t + Number(day.otherOut || 0), 0);
  const other = sum(month, "otherIn");
  const profit = sales + other - cogs - fixed;
  const be = cogs + fixed;
  return { sales, cogs, fixed, other, profit, be, guests: sum(month, "guests") };
}
function render() {
  Jiuwo.save(KEY, state);
  document.getElementById("mode").textContent = state.mode === "store" ? "門市版" : "公司版";
  document.getElementById("shop").value = state.shop;
  document.getElementById("year").value = state.year;
  document.getElementById("months").innerHTML = state.months.map((month, index) => `<button type="button" data-m="${index+1}" class="${state.month===index+1?"on":""}">${index+1}${storePL(month).sales?"·":""}</button>`).join("") + `<button type="button" id="yearview" class="${state.month===0?"on":""}">年度總覽</button>`;
  document.querySelectorAll("[data-m]").forEach((button) => button.onclick = () => { state.month = Number(button.dataset.m); render(); });
  document.getElementById("yearview").onclick = () => { state.month = 0; render(); };
  if (!state.month) return renderYear();
  if (state.mode === "company") return renderCompany();
  const month = cur();
  const pl = storePL(month);
  const last = storePL(prev());
  const matched = month.days.filter((day) => active(day) && cash(day).diff === 0).length;
  const written = month.days.filter(active).length;
  document.getElementById("kpi").innerHTML = [
    ["營業額", pl.sales.toLocaleString()],
    ["達成率", month.target ? (pl.sales / month.target * 100).toFixed(1) + "%" : "—"],
    ["淨利", pl.profit.toLocaleString()],
    ["兩平", Math.round(pl.be).toLocaleString()],
    ["安全邊際", pl.sales ? ((pl.sales - pl.be) / pl.sales * 100).toFixed(1) + "%" : "—"]
  ].map(([k, v]) => `<div><small>${k}</small><br><b>${v}</b></div>`).join("") + `<div><small>收銀</small><br><b>對了 ${matched} 天</b><br>有寫 ${written} 天</div>`;
  document.getElementById("tabs").innerHTML = ["journal","target","waste","pl"].map((id) => `<button type="button" data-tab="${id}" class="${state.tab===id?"on":""}">${{journal:"日記帳",target:"營收與目標",waste:"損耗",pl:"月損益"}[id]}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach((button) => button.onclick = () => { state.tab = button.dataset.tab; render(); });
  if (state.tab === "journal") renderJournal(month);
  else if (state.tab === "target") renderTarget(month);
  else if (state.tab === "waste") renderWaste(month);
  else renderStorePL(month, pl, last);
}
function renderJournal(month) {
  const head = "<tr><th>日</th><th>店內</th><th>外送</th><th>來客</th><th>進貨</th><th>費用付現</th><th>其他收入</th><th>其他支出</th><th>收銀機</th><th>差額</th></tr>";
  document.getElementById("body").innerHTML = `<table class="sheet">${head}${month.days.map((day, index) => {
    const diff = cash(day).diff;
    return `<tr><td>${index+1}</td>${["dine","delivery","guests","buy","cashExp","otherIn","otherOut","register"].map((key) => `<td><input data-d="${index}" data-k="${key}" type="number" value="${day[key]||""}"></td>`).join("")}<td>${active(day) ? diff : ""}</td></tr>`;
  }).join("")}</table><p>外送不計入收銀機。應有現金＝店內＋其他收入－費用付現－其他支出。差額＝收銀機－應有現金。</p>`;
  document.querySelectorAll("[data-d]").forEach((input) => input.onchange = () => { month.days[input.dataset.d][input.dataset.k] = Number(input.value || 0); render(); });
}
function renderTarget(month) {
  let runSales = 0, runTarget = 0;
  const open = month.days.filter(active).length || 1;
  document.getElementById("body").innerHTML = `<p>本月目標 <input id="target" type="number" value="${month.target}"> 平均每天 ${Math.round(month.target / 31).toLocaleString()} 元</p><table><tr><th>日</th><th>當日營業</th><th>當日目標</th><th>達成</th><th>累計營業</th><th>累計目標</th><th>累計達成</th></tr>` +
    month.days.map((day, index) => {
      const sales = Number(day.dine) + Number(day.delivery);
      const dayTarget = Math.round(month.target / 31);
      runSales += sales; runTarget += dayTarget;
      return `<tr><td>${index+1}</td><td>${sales||""}</td><td>${dayTarget}</td><td>${dayTarget? (sales/dayTarget*100).toFixed(0)+"%" : ""}</td><td>${runSales||""}</td><td>${runTarget}</td><td>${runTarget? (runSales/runTarget*100).toFixed(0)+"%" : ""}</td></tr>`;
    }).join("") + "</table>";
  document.getElementById("target").onchange = (event) => { month.target = Number(event.target.value); render(); };
}
function renderWaste(month) {
  const sales = storePL(month).sales || 1;
  const last = prev().waste.reduce((t, row) => t + Number(row.amount||0), 0);
  const now = month.waste.reduce((t, row) => t + Number(row.amount||0), 0);
  document.getElementById("body").innerHTML = month.waste.map((row, index) => `<p><input data-w="item" data-i="${index}" value="${row.item}"> <select data-w="reason" data-i="${index}">${["進太多","備太多","溫度","客訴"].map((reason) => `<option ${row.reason===reason?"selected":""}>${reason}</option>`).join("")}</select> 數量 <input data-w="qty" data-i="${index}" type="number" value="${row.qty}"> 金額 <input data-w="amount" data-i="${index}" type="number" value="${row.amount}"> <button type="button" data-del="${index}">刪</button></p>`).join("") +
    `<button type="button" id="addw">加一筆</button><p>損耗率 ${(now/sales*100).toFixed(2)}%，上月 ${last.toLocaleString()} 元。</p>`;
  document.querySelectorAll("[data-w]").forEach((input) => input.onchange = () => { month.waste[input.dataset.i][input.dataset.w] = input.dataset.w === "item" || input.dataset.w === "reason" ? input.value : Number(input.value); Jiuwo.save(KEY, state); });
  document.querySelectorAll("[data-del]").forEach((button) => button.onclick = () => { month.waste.splice(Number(button.dataset.del), 1); render(); });
  document.getElementById("addw").onclick = () => { month.waste.push({ item: "品項", reason: "進太多", qty: 1, amount: 0 }); render(); };
}
function renderStorePL(month, pl, last) {
  const row = (name, now, before) => `<tr><td>${name}</td><td>${Math.round(now).toLocaleString()}</td><td>${Math.round(before).toLocaleString()}</td><td>${Math.round(now-before).toLocaleString()}</td></tr>`;
  document.getElementById("body").innerHTML = `<table><tr><th>項目</th><th>本月</th><th>上月</th><th>差</th></tr>
    ${row("營業額", pl.sales, last.sales)}${row("進貨", pl.cogs, last.cogs)}${row("付現與其他支出", pl.fixed, last.fixed)}${row("其他收入", pl.other, last.other)}${row("淨利", pl.profit, last.profit)}</table>
    <p>數字從日記帳加總。進貨比 ${pl.sales ? (pl.cogs/pl.sales*100).toFixed(1) : 0}%。</p>`;
}
function renderYear() {
  const rows = state.months.map(storePL);
  const max = Math.max(...rows.map((row) => row.sales), 1);
  const bars = rows.map((row, index) => {
    const h = row.sales / max * 120;
    const low = row.sales < row.be;
    const be = row.be / max * 120;
    return `<g transform="translate(${index*46},0)"><rect class="${low?"low":"bar"}" x="8" y="${140-h}" width="24" height="${h}"></rect><line x1="4" x2="36" y1="${140-be}" y2="${140-be}" stroke="#e15a2b"/><text x="8" y="156">${index+1}</text></g>`;
  }).join("");
  document.getElementById("kpi").innerHTML = "";
  document.getElementById("tabs").innerHTML = "";
  document.getElementById("body").innerHTML = `<h2>${state.shop} ${state.year}</h2><svg viewBox="0 0 560 170" width="100%" height="280">${bars}</svg><p>橘線是該月兩平。低於兩平的月份是紅色。</p><table><tr><th>月</th><th>營業額</th><th>淨利</th><th>兩平</th></tr>${rows.map((row, i) => `<tr><td>${i+1}</td><td>${Math.round(row.sales).toLocaleString()}</td><td>${Math.round(row.profit).toLocaleString()}</td><td>${Math.round(row.be).toLocaleString()}</td></tr>`).join("")}</table>`;
}
function companyPL(c) {
  const net = c.revenue - c.discount;
  const cogs = c.begin + c.buy - c.returns - c.end;
  const variable = c.variable.reduce((t, line) => t + Number(line.amount||0), 0);
  const fixed = c.fixed.reduce((t, line) => t + Number(line.amount||0), 0);
  const operate = net - cogs - variable - fixed;
  const before = operate + Number(c.other||0);
  const tax = before > 0 ? before * (c.taxRate||0) / 100 : 0;
  return { net, cogs, variable, fixed, operate, before, tax, profit: before - tax, be: cogs + variable + fixed };
}
function renderCompany() {
  const c = cur().company;
  const pl = companyPL(c);
  document.getElementById("kpi").innerHTML = `<div>本期損益<br><b>${Math.round(pl.profit).toLocaleString()}</b></div><div>兩平<br><b>${Math.round(pl.be).toLocaleString()}</b></div>`;
  document.getElementById("tabs").innerHTML = "";
  document.getElementById("body").innerHTML = `<p>營業收入 <input data-c="revenue" type="number" value="${c.revenue}"> 減項 <input data-c="discount" type="number" value="${c.discount}"> 淨額 ${pl.net.toLocaleString()}</p>
    <p>期初存貨 <input data-c="begin" type="number" value="${c.begin}"> 進貨 <input data-c="buy" type="number" value="${c.buy}"> 退出 <input data-c="returns" type="number" value="${c.returns}"> 期末存貨 <input data-c="end" type="number" value="${c.end}"> 銷貨成本 ${pl.cogs.toLocaleString()}</p>
    <h3>變動費用</h3>${c.variable.map((line, i) => `<p><input data-v="name" data-i="${i}" value="${line.name}"> <input data-v="amount" data-i="${i}" type="number" value="${line.amount}"></p>`).join("")}<button type="button" id="addv">加變動</button>
    <h3>固定費用</h3>${c.fixed.map((line, i) => `<p><input data-x="name" data-i="${i}" value="${line.name}"> <input data-x="amount" data-i="${i}" type="number" value="${line.amount}"></p>`).join("")}<button type="button" id="addx">加固定</button>
    <p><button type="button" id="copyfee">複製上個月費用</button></p>
    <p>營業淨利 ${Math.round(pl.operate).toLocaleString()}。營業外 <input data-c="other" type="number" value="${c.other}">。稅前 ${Math.round(pl.before).toLocaleString()}。所得稅率 <input data-c="taxRate" type="number" value="${c.taxRate}">% ，稅 ${Math.round(pl.tax).toLocaleString()}。本期損益 ${Math.round(pl.profit).toLocaleString()}。</p>`;
  document.querySelectorAll("[data-c]").forEach((input) => input.onchange = () => { c[input.dataset.c] = Number(input.value); render(); });
  document.querySelectorAll("[data-v]").forEach((input) => input.onchange = () => { c.variable[input.dataset.i][input.dataset.v] = input.dataset.v === "amount" ? Number(input.value) : input.value; Jiuwo.save(KEY, state); });
  document.querySelectorAll("[data-x]").forEach((input) => input.onchange = () => { c.fixed[input.dataset.i][input.dataset.x] = input.dataset.x === "amount" ? Number(input.value) : input.value; Jiuwo.save(KEY, state); });
  document.getElementById("addv").onclick = () => { c.variable.push({ name: "新變動", amount: 0 }); render(); };
  document.getElementById("addx").onclick = () => { c.fixed.push({ name: "新固定", amount: 0 }); render(); };
  document.getElementById("copyfee").onclick = () => {
    const source = (state.months[state.month - 2] || cur()).company;
    c.variable = source.variable.map((line) => ({ ...line }));
    c.fixed = source.fixed.map((line) => ({ ...line }));
    render();
  };
}
function renderYearCompanyColors() { /* store year handles both; company months still have days */ }
document.getElementById("mode").onclick = () => { state.mode = state.mode === "store" ? "company" : "store"; render(); };
document.getElementById("shop").onchange = (e) => { state.shop = e.target.value; Jiuwo.save(KEY, state); };
document.getElementById("year").onchange = (e) => { state.year = Number(e.target.value); Jiuwo.save(KEY, state); };
function journalRows(month) {
  return [["日","店內","外送","來客","進貨","費用付現","其他收入","其他支出","收銀機"], ...month.days.map((day, i) => [i+1, day.dine, day.delivery, day.guests, day.buy, day.cashExp, day.otherIn, day.otherOut, day.register])];
}
document.getElementById("exp").onclick = () => Jiuwo.xlsx(state.shop + "-" + state.month + "月.xlsx", journalRows(cur()).concat([["損耗品項","原因","數量","金額"], ...cur().waste.map((row) => [row.item, row.reason, row.qty, row.amount])]));
document.getElementById("tpl").onclick = () => Jiuwo.xlsx("日記帳範本.xlsx", [["日","店內","外送","來客","進貨","費用付現","其他收入","其他支出","收銀機"], ...Array.from({length:31}, (_,i)=>[i+1,0,0,0,0,0,0,0,0])]);
document.getElementById("imp").onchange = async (event) => {
  const rows = await Jiuwo.read(event.target.files[0]);
  const month = cur();
  let days = 0, waste = 0;
  rows.slice(1).forEach((row) => {
    const day = Number(row[0]);
    if (day >= 1 && day <= 31 && row.length >= 5) {
      const item = month.days[day - 1];
      ["dine","delivery","guests","buy","cashExp","otherIn","otherOut","register"].forEach((key, index) => { if (row[index+1] !== "") item[key] = Number(row[index+1]) || 0; });
      days += 1;
    } else if (row[0] && row[3] !== "" && !day) {
      month.waste.push({ item: row[0], reason: row[1] || "進太多", qty: Number(row[2])||0, amount: Number(row[3])||0 });
      waste += 1;
    }
  });
  document.getElementById("note").textContent = `已讀回日記帳 ${days} 天、損耗 ${waste} 筆。`;
  render();
};
document.getElementById("print").onclick = () => window.print();
document.getElementById("clear").onclick = () => { state.months[state.month-1] = blankMonth(false); render(); };
document.getElementById("demo").onclick = () => { state = structuredClone(DEMO); render(); };
render();
</script>
