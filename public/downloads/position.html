<!doctype html>
<html lang="zh-Hant-TW">
<meta charset="utf-8">
<link rel="stylesheet" href="/downloads/tool-frame.css">
<title>品牌定位圖</title>
<style>
  svg { width: 100%; height: min(68vh, 640px); background: #fbfaf6; border: 1px solid var(--line); border-radius: 12px; }
  .brand { border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 8px; background: #fff; }
  .why-table td { vertical-align: top; }
</style>
<body class="tool">
<div class="shell">
  <header class="hero">
    <p class="kicker">久沃實戰筆記｜行銷工具箱</p>
    <h1>品牌定位圖</h1>
    <p>把你和客人會拿來比的店放在同一張圖。看自己站哪、空在哪。圓的大小你自己定。</p>
  </header>
  <div class="actions">
    <button type="button" class="primary" id="demo">載入範例</button>
    <button type="button" id="clear">清空重來</button>
    <button type="button" id="png">存成圖片</button>
    <button type="button" id="json">存成檔案</button>
    <button type="button" id="print">列印</button>
    <label class="hint">開啟檔案 <input id="open" type="file" accept=".json"></label>
  </div>
  <div class="split">
    <div>
      <section class="panel">
        <input id="title" style="width:100%;font-weight:700">
        <svg id="board" viewBox="0 0 400 400"></svg>
        <p class="hint">圓越大，代表你用「圓的大小」那一欄填得越大。虛線圈是你想去的位置。</p>
      </section>
      <section class="panel"><h2>為什麼這樣打</h2><div id="why"></div><p id="hint"></p></section>
    </div>
    <aside class="rail">
      <section class="panel"><h2><span class="n">1</span> 挑兩件客人會比的事</h2>
        <label class="f">左右比什麼<select id="x"></select></label>
        <div class="grid2"><label class="f">最左邊<input id="x0" placeholder="可留白，用預設"></label><label class="f">最右邊<input id="x1"></label></div>
        <label class="f">上下比什麼<select id="y"></select></label>
        <div class="grid2"><label class="f">最下面<input id="y0"></label><label class="f">最上面<input id="y1"></label></div>
        <label class="f">圓的大小代表<input id="size"></label>
      </section>
      <section class="panel"><h2><span class="n">2</span> 放品牌、打分數</h2>
        <p class="hint">0 到 10。先放自己，再放三到六家客人會拿來比的店。</p>
        <div id="cards"></div>
        <button type="button" id="add">＋ 新增一個品牌</button>
      </section>
    </aside>
  </div>
</div>
<script src="/vendor/jiuwo-kit.js"></script>
<script>
function esc(text) { return String(text ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
const KEY = "jiuwo.tool.position.v2";
const AXES = {
  "價格": ["便宜", "貴"],
  "品項數": ["少", "多"],
  "感覺": ["家常", "講究"],
  "信任理由": ["熟人介紹", "自己吃過"],
  "風格": ["快速", "坐得久"],
  "客群": ["附近上班", "特地來"],
  "要不要自己煮": ["現成", "現做"],
  "通路": ["只做內用", "內用加外送"],
  "講究程度": ["吃飽", "挑"],
};
const DEMO = {
  title: "久沃和附近幾家",
  x: "價格", y: "感覺", x0: "", x1: "", y0: "", y1: "", size: "價位帶",
  brands: [
    { name: "久沃", x: 6, y: 7, size: 18, mine: true, tx: 7, ty: 8, why: "份量夠，價格還在附近午餐帶。" },
    { name: "巷口麵", x: 3, y: 4, size: 14, mine: false, tx: 3, ty: 4, why: "便宜、出餐快。" },
    { name: "市場熱炒", x: 5, y: 3, size: 22, mine: false, tx: 5, ty: 3, why: "晚上才熱鬧。" },
  ],
};
let state = Object.assign(structuredClone(DEMO), Jiuwo.load(KEY, DEMO));
const board = document.getElementById("board");
function ends(key, a, b) { return [state[a] || AXES[state[key]][0], state[b] || AXES[state[key]][1]]; }
function render() {
  Jiuwo.save(KEY, state);
  document.getElementById("title").value = state.title;
  document.getElementById("size").value = state.size;
  ["x","y"].forEach((axis) => {
    const select = document.getElementById(axis);
    if (!select.options.length) select.innerHTML = Object.keys(AXES).map((name) => `<option>${name}</option>`).join("") + "<option>自訂</option>";
    select.value = state[axis];
  });
  const [x0, x1] = ends("x", "x0", "x1");
  const [y0, y1] = ends("y", "y0", "y1");
  document.getElementById("x0").value = state.x0;
  document.getElementById("x1").value = state.x1;
  document.getElementById("y0").value = state.y0;
  document.getElementById("y1").value = state.y1;
  board.innerHTML = `<line x1="200" y1="20" x2="200" y2="380" stroke="#ccc"/><line x1="20" y1="200" x2="380" y2="200" stroke="#ccc"/>
    <text x="24" y="210">${x0}</text><text x="330" y="210">${x1}</text><text x="204" y="390">${y0}</text><text x="204" y="32">${y1}</text>` +
    state.brands.map((brand, index) => {
      const cx = 20 + brand.x / 10 * 360;
      const cy = 380 - brand.y / 10 * 360;
      const tx = 20 + (brand.tx || brand.x) / 10 * 360;
      const ty = 380 - (brand.ty || brand.y) / 10 * 360;
      return `<circle data-i="${index}" cx="${cx}" cy="${cy}" r="${brand.size}" fill="${brand.mine ? "#1d3c34" : "#e15a2b"}" opacity="0.85"></circle>
        <text x="${cx+brand.size}" y="${cy}">${esc(brand.name)}</text>
        ${brand.mine ? `<circle cx="${tx}" cy="${ty}" r="${brand.size+8}" fill="none" stroke="#1d3c34" stroke-dasharray="4 3"></circle><line x1="${cx}" y1="${cy}" x2="${tx}" y2="${ty}" stroke="#1d3c34"/>` : ""}`;
    }).join("");
  const hints = [];
  const quads = [0,0,0,0];
  state.brands.forEach((brand) => { quads[(brand.x >= 5 ? 1 : 0) + (brand.y >= 5 ? 2 : 0)] += 1; });
  quads.forEach((count, index) => { if (!count) hints.push("有一個象限是空的。"); });
  for (let i = 0; i < state.brands.length; i++) for (let j = i + 1; j < state.brands.length; j++) {
    const d = Math.hypot(state.brands[i].x - state.brands[j].x, state.brands[i].y - state.brands[j].y);
    if (d < 1.5) hints.push(state.brands[i].name + "和" + state.brands[j].name + "太近。");
  }
  state.brands.filter((brand) => brand.mine).forEach((brand) => {
    const d = Math.hypot((brand.tx || brand.x) - brand.x, (brand.ty || brand.y) - brand.y);
    hints.push(brand.name + "離想去的位置 " + d.toFixed(1) + " 格。");
  });
  document.getElementById("hint").textContent = hints.join(" ");
  document.getElementById("cards").innerHTML = state.brands.map((brand, index) => `<div class="brand"><label class="f">名稱<input data-i="${index}" data-f="name" value="${esc(brand.name)}"></label> <button type="button" data-del="${index}">×</button>
    <div class="grid3"><label class="f">左右分數<input data-i="${index}" data-f="x" type="number" min="0" max="10" step="0.1" value="${brand.x}"></label>
    <label class="f">上下分數<input data-i="${index}" data-f="y" type="number" min="0" max="10" step="0.1" value="${brand.y}"></label>
    <label class="f">大小<input data-i="${index}" data-f="size" type="number" value="${brand.size}"></label></div>
    <label><input data-i="${index}" data-f="mine" type="checkbox" ${brand.mine ? "checked" : ""}> 這是我自己的品牌</label>
    <label class="f">為什麼打在這裡<input data-i="${index}" data-f="why" value="${esc(brand.why || "")}"></label></div>`).join("");
  document.getElementById("why").innerHTML = state.brands.map((brand) => `<p><b>${esc(brand.name)}</b> ${esc(brand.why || "")}</p>`).join("");
  board.querySelectorAll("circle[data-i]").forEach((circle) => {
    circle.onpointerdown = (event) => {
      const move = (ev) => {
        const rect = board.getBoundingClientRect();
        const brand = state.brands[circle.dataset.i];
        brand.x = Math.min(10, Math.max(0, (ev.clientX - rect.left) / rect.width * 10));
        brand.y = Math.min(10, Math.max(0, 10 - (ev.clientY - rect.top) / rect.height * 10));
        render();
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", () => window.removeEventListener("pointermove", move), { once: true });
    };
  });
  document.querySelectorAll("#cards input").forEach((input) => input.oninput = () => {
    const brand = state.brands[input.dataset.i];
    if (input.dataset.f === "mine") brand.mine = input.checked;
    else if (input.dataset.f === "why" || input.dataset.f === "name") brand[input.dataset.f] = input.value;
    else {
      if (input.value.trim() === "") return;
      const number = Number(input.value);
      if (!Number.isFinite(number)) return;
      brand[input.dataset.f] = Math.min(input.dataset.f === "size" ? 80 : 10, Math.max(0, number));
    }
    if (input.dataset.f === "why") { Jiuwo.save(KEY, state); document.getElementById("why").innerHTML = state.brands.map((item) => `<p><b>${item.name}</b> ${item.why || ""}</p>`).join(""); return; }
    render();
    const again = document.querySelector(`#cards input[data-i="${input.dataset.i}"][data-f="${input.dataset.f}"]`);
    if (again) again.focus();
  });
  document.querySelectorAll("[data-del]").forEach((button) => button.onclick = () => { state.brands.splice(Number(button.dataset.del), 1); render(); });
}
["x","y","x0","x1","y0","y1"].forEach((id) => document.getElementById(id).onchange = (event) => { state[id] = event.target.value; render(); });
document.getElementById("title").oninput = (event) => { state.title = event.target.value; Jiuwo.save(KEY, state); };
document.getElementById("size").oninput = (event) => { state.size = event.target.value; Jiuwo.save(KEY, state); };
document.getElementById("add").onclick = () => { state.brands.push({ name: "新品牌", x: 5, y: 5, size: 16, mine: false, tx: 5, ty: 5, why: "" }); render(); };
document.getElementById("demo").onclick = () => { state = structuredClone(DEMO); render(); };
document.getElementById("clear").onclick = () => { state.brands = []; render(); };
document.getElementById("json").onclick = () => { const blob = new Blob([JSON.stringify(state)], { type: "application/json" }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "定位圖.json"; link.click(); };
document.getElementById("open").onchange = async (event) => {
  const file = event.target.files && event.target.files[0];
  event.target.value = "";
  if (!file) return;
  try {
    const next = JSON.parse(await file.text());
    if (!next || !Array.isArray(next.brands)) throw new Error("bad");
    state = next;
    render();
  } catch (error) {
    alert("這份定位圖讀不起來。請選先前存下來的檔案。");
  }
};
document.getElementById("png").onclick = () => {
  const xml = new XMLSerializer().serializeToString(board);
  const image = new Image();
  image.onload = () => { const canvas = document.createElement("canvas"); canvas.width = 800; canvas.height = 800; canvas.getContext("2d").drawImage(image, 0, 0, 800, 800); const link = document.createElement("a"); link.href = canvas.toDataURL("image/png"); link.download = "定位圖.png"; link.click(); };
  image.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
};
document.getElementById("print").onclick = () => window.print();
render();
</script>
