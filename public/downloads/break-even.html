<!doctype html>
<html lang="zh-Hant-TW">
<meta charset="utf-8">
<link rel="stylesheet" href="/downloads/tool-frame.css">
<title>損益兩平</title>
<body class="tool">
<div class="shell">
  <header class="hero">
    <p class="kicker">久沃實戰筆記｜開店、開公司都用得上</p>
    <h1>損益兩平計算</h1>
    <p>把每個月一定要付的錢，和會跟著生意走的成本分開。算出做到多少才不賠。數字只留在這台裝置。</p>
  </header>
  <div class="modes">
    <button type="button" id="store">門市版（餐飲／零售）</button>
    <button type="button" id="company">公司版（電商／品牌／貿易）</button>
  </div>
  <div class="split">
    <div id="form"></div>
    <aside class="rail" id="out"></aside>
  </div>
  <div class="actions">
    <button type="button" class="primary" id="csv">匯出 Excel（CSV）</button>
    <button type="button" id="print">列印／存成 PDF</button>
    <button type="button" id="clear">數字全部清空</button>
    <button type="button" id="demo">還原成範例</button>
  </div>
</div>
<script src="/vendor/jiuwo-kit.js"></script>
<script>
const KEY = "jiuwo.tool.break-even.v3";
const STORE = [
  { name: "本月進貨", note: "食材、包材、會跟著出餐走的", amount: 171000, kind: "變動" },
  { name: "水費", note: "店裡用水", amount: 1500, kind: "固定" },
  { name: "電話費", note: "市話、網路", amount: 700, kind: "固定" },
  { name: "員工薪津", note: "含老闆自己的薪水", amount: 110000, kind: "固定" },
  { name: "勞健保", note: "公司負擔的部分", amount: 18000, kind: "固定" },
  { name: "租金費用", note: "店面房租", amount: 30000, kind: "固定" },
  { name: "瓦斯", note: "", amount: 3500, kind: "固定" },
  { name: "水電以外的修繕", note: "攤到每個月", amount: 1000, kind: "固定" },
  { name: "每月折舊攤提", note: "設備總額 ÷ 用幾個月", amount: 15000, kind: "固定" },
];
const COMPANY = [
  { name: "銷貨成本", note: "進貨減退回，含期初期末", amount: 380000, kind: "變動" },
  { name: "總部人事", note: "沒有在店裡上班的人", amount: 80000, kind: "固定" },
  { name: "倉儲租金", note: "", amount: 25000, kind: "固定" },
  { name: "廣告", note: "每月固定檔，不是單筆", amount: 20000, kind: "固定" },
];
const DEMO = { mode: "store", sales: 520000, days: 26, ticket: 140, want: 80000, lines: STORE, discount: 10 };
let state = Object.assign(structuredClone(DEMO), Jiuwo.load(KEY, DEMO));
if (!Array.isArray(state.lines)) state.lines = structuredClone(STORE);
function compute() {
  const variable = state.lines.filter((line) => line.kind === "變動").reduce((sum, line) => sum + Number(line.amount || 0), 0);
  const fixed = state.lines.filter((line) => line.kind === "固定").reduce((sum, line) => sum + Number(line.amount || 0), 0);
  const rate = state.sales > 0 ? variable / state.sales : 0;
  const contribution = 1 - rate;
  const breakSales = contribution > 0 ? fixed / contribution : 0;
  const profit = state.sales - variable - fixed;
  const safety = state.sales > 0 ? (state.sales - breakSales) / state.sales : 0;
  const targetSales = contribution > 0 ? (fixed + Number(state.want || 0)) / contribution : 0;
  const factor = 1 - state.discount / 100;
  const discounted = contribution > 0 && factor > 0 ? fixed / (contribution * factor) : 0;
  const day = state.days ? breakSales / state.days : 0;
  const guests = state.ticket ? day / state.ticket : 0;
  const extraGuests = state.ticket && factor > 0 ? (discounted / state.days / (state.ticket * factor)) - guests : 0;
  return { variable, fixed, rate, contribution, breakSales, profit, safety, targetSales, day, guests, extraGuests, discounted };
}
function render() {
  Jiuwo.save(KEY, state);
  document.getElementById("store").classList.toggle("on", state.mode === "store");
  document.getElementById("company").classList.toggle("on", state.mode === "company");
  const variable = state.lines.filter((line) => line.kind === "變動");
  const fixed = state.lines.filter((line) => line.kind === "固定");
  const row = (line) => {
    const index = state.lines.indexOf(line);
    const pct = state.sales ? (line.amount / state.sales * 100).toFixed(1) : "0.0";
    return `<div class="grid3" style="grid-template-columns:1.4fr .8fr auto;align-items:end;margin-bottom:8px">
      <label class="f">${line.note || "項目"}<input data-n="${index}" value="${line.name}"></label>
      <label class="f">金額<input data-a="${index}" type="number" value="${line.amount}"></label>
      <span>${pct}% <button type="button" data-del="${index}">×</button></span></div>`;
  };
  const result = compute();
  document.getElementById("form").innerHTML = `
    <section class="step"><h2><span class="n">1</span> 基本資料</h2><p>下面先填現在這個月的營業。想賺多少是目標，不是已經賺到的。</p>
      <div class="grid4">${field("sales","月營業額")}${field("days","每月營業天數")}${field("ticket","客單價")}${field("want","每月想賺多少")}</div></section>
    <section class="step"><h2><span class="n">2</span> 變動成本　賣越多花越多</h2><p>食材、包材、平台抽成。這筆要跟營業額一起看大小。</p>
      ${variable.map(row).join("") || "<p class='hint'>還沒有變動成本。</p>"}
      <div class="rowline"><span>變動成本合計</span><b>${yuan(result.variable)}（${pctOf(result.rate)}）</b></div>
      <button type="button" id="addv">＋ 新增變動成本項目</button></section>
    <section class="step"><h2><span class="n">3</span> 固定成本　沒客人也要付</h2><p>房租、人事、水電。不營業也跑不掉的。</p>
      ${fixed.map(row).join("")}
      <div class="rowline"><span>固定成本合計</span><b>${Math.round(result.fixed).toLocaleString()} 元</b></div>
      <button type="button" id="addf">＋ 新增固定成本項目</button></section>
    <section class="step"><h2><span class="n">4</span> 小損益表</h2>
      <table class="sheet"><tr><th>項目</th><th>金額</th><th>占營業額</th></tr>
        <tr><td>營業收入</td><td>${Math.round(state.sales).toLocaleString()}</td><td>100%</td></tr>
        <tr><td>減：變動成本</td><td>${yuan(result.variable)}</td><td>${pctOf(result.rate)}</td></tr>
        <tr><td>邊際貢獻</td><td>${yuan(state.sales - result.variable)}</td><td>${pctOf(result.contribution)}</td></tr>
        <tr><td>減：固定成本</td><td>${Math.round(result.fixed).toLocaleString()}</td><td>${state.sales ? (result.fixed/state.sales*100).toFixed(1) : 0}%</td></tr>
        <tr><td>營業淨利</td><td>${Math.round(result.profit).toLocaleString()}</td><td>${state.sales ? (result.profit/state.sales*100).toFixed(1) : 0}%</td></tr>
      </table></section>`;
  ["sales","days","ticket","want"].forEach((id) => { const node = document.getElementById(id); if (node) node.oninput = () => { const n = Number(node.value); if (node.value.trim() !== "" && !Number.isFinite(n)) return; state[id] = node.value.trim() === "" ? 0 : n; paint(); Jiuwo.save(KEY, state); }; });
  document.querySelectorAll("[data-n]").forEach((input) => input.onchange = () => { state.lines[input.dataset.n].name = input.value; Jiuwo.save(KEY, state); });
  document.querySelectorAll("[data-a]").forEach((input) => input.oninput = () => {
    const n = Number(input.value);
    if (input.value.trim() !== "" && !Number.isFinite(n)) return;
    state.lines[input.dataset.a].amount = input.value.trim() === "" ? 0 : n;
    paint();
    Jiuwo.save(KEY, state);
  });
  document.querySelectorAll("[data-del]").forEach((button) => button.onclick = () => { state.lines.splice(Number(button.dataset.del), 1); render(); });
  document.getElementById("addv").onclick = () => { state.lines.push({ name: "新變動", note: "", amount: 0, kind: "變動" }); render(); };
  document.getElementById("addf").onclick = () => { state.lines.push({ name: "新固定", note: "", amount: 0, kind: "固定" }); render(); };
  paint();
}
function field(key, label) { return `<label class="f">${label}<input id="${key}" type="number" value="${state[key]}"></label>`; }
function yuan(n) { return Number.isFinite(n) ? Math.round(n).toLocaleString() + " 元" : "—"; }
function pctOf(n) { return Number.isFinite(n) ? (n * 100).toFixed(1) + "%" : "—"; }
function paint() {
  const result = compute();
  const possible = result.contribution > 0 && Number.isFinite(result.breakSales) && result.breakSales > 0;
  const daily = possible && state.days > 0 ? result.day : null;
  const guests = possible && state.days > 0 && state.ticket > 0 ? result.guests : null;
  const goal = possible ? result.targetSales : null;
  const safety = possible && state.sales > 0 ? result.safety : null;
  const extra = possible && state.days > 0 && state.ticket > 0 && result.contribution * (1 - state.discount / 100) > 0 ? result.extraGuests : null;
  const width = possible && state.sales > 0 ? Math.max(4, Math.min(100, result.breakSales / Math.max(state.sales, result.breakSales) * 100)) : 0;
  document.getElementById("out").innerHTML = `<div class="goal"><small>損益兩平營業額（每月）</small><b>${possible ? yuan(result.breakSales) : "算不出來"}</b><span style="font-size:12px;color:rgba(255,255,255,.7)">${possible ? "平均每天 " + yuan(daily) + (guests == null ? "" : "，約 " + Math.round(guests) + " 位客人") : "變動成本已經高過或等於營業額，請先改成本或售價。"}</span></div>
    <section class="card"><h2 style="font-size:15px">計算結果</h2>
      <div class="stack" style="height:18px;margin:8px 0"><i style="width:${width}%;background:#3aaa7a"></i></div>
      <div class="rowline"><span>目前每月損益</span><b>${yuan(result.profit)}</b></div>
      <div class="rowline"><span>變動成本率</span><b>${pctOf(result.rate)}</b></div>
      <div class="rowline"><span>邊際貢獻率</span><b>${pctOf(result.contribution)}</b></div>
      <div class="rowline"><span>每天要做</span><b>${possible ? yuan(daily) : "算不出來"}</b></div>
      <div class="rowline"><span>安全邊際</span><b>${pctOf(safety)}</b></div>
      <div class="rowline"><span>要賺到想要的</span><b>${possible ? yuan(goal) : "算不出來"}</b></div>
    </section>
    <section class="card"><h2 style="font-size:15px"><span class="n">6</span> 如果打折會怎樣</h2>
      <p class="hint">全面打 ${state.discount}% 。食材不會因為打折變少。</p>
      <label class="f">打掉幾 %<input id="discount" type="range" min="0" max="40" value="${state.discount}"></label>
      <div class="rowline"><span>每天要多幾位</span><b>${extra == null ? "—" : Math.max(0, extra).toFixed(0) + " 位"}</b></div>
      <div class="note warn">${possible ? "打折前先把這格拉一下。多出來的客人，是為了補回被折掉的客單。" : "現在還算不出兩平，打折後要多幾位也先空白。"}</div>
    </section>`;
  const discount = document.getElementById("discount");
  discount.oninput = () => { state.discount = Number(discount.value); paint(); Jiuwo.save(KEY, state); };
}
document.getElementById("store").onclick = () => { state.mode = "store"; state.lines = structuredClone(STORE); render(); };
document.getElementById("company").onclick = () => { state.mode = "company"; state.lines = structuredClone(COMPANY); render(); };
document.getElementById("csv").onclick = () => {
  const result = compute();
  const possible = result.contribution > 0 && Number.isFinite(result.breakSales) && result.breakSales > 0;
  Jiuwo.csv("損益兩平.csv", [["營業額", state.sales], ["變動", Math.round(result.variable)], ["固定", Math.round(result.fixed)], ["兩平", possible ? Math.round(result.breakSales) : "—"], ["每天要做", possible && state.days > 0 ? Math.round(result.day) : "—"], ["要賺到想要的", possible ? Math.round(result.targetSales) : "—"], ["淨利", Number.isFinite(result.profit) ? Math.round(result.profit) : "—"], ["安全邊際", possible && state.sales > 0 ? result.safety : "—"]]);
};
document.getElementById("print").onclick = () => window.print();
document.getElementById("clear").onclick = () => { state.sales = 0; state.lines.forEach((line) => { line.amount = 0; }); render(); };
document.getElementById("demo").onclick = () => { state = structuredClone(DEMO); render(); };
render();
</script>
