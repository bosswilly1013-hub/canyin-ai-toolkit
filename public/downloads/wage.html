<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>時薪試算</title>
<body style="font-family:sans-serif;max-width:520px;margin:24px">
<h1>這週人力大概多少</h1>
<p>時薪乘時數。不是薪資條。存在這台裝置。</p>
<label>姓名 <input id="name"></label>
<label>時薪 <input id="wage" type="number"></label>
<label>這週時數 <input id="hours" type="number"></label>
<p id="out"></p>
<button id="clear" type="button">清空示範資料</button>
<script>
const KEY = "jiuwo.tool.wage";
const demo = { name: "早班外場", wage: 196, hours: 32 };
const ids = Object.keys(demo);
function read() { try { return { ...demo, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch { return { ...demo }; } }
function write() {
  const data = {};
  ids.forEach((id) => { data[id] = document.getElementById(id).value; });
  localStorage.setItem(KEY, JSON.stringify(data));
  document.getElementById("out").textContent = data.name + " 這週約 " + Math.round(Number(data.wage) * Number(data.hours)) + " 元。";
}
const saved = read();
ids.forEach((id) => { document.getElementById(id).value = saved[id]; document.getElementById(id).addEventListener("input", write); });
document.getElementById("clear").onclick = () => { localStorage.removeItem(KEY); ids.forEach((id) => { document.getElementById(id).value = demo[id]; }); write(); };
write();
</script>
