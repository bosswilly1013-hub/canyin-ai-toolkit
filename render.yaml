# Next.js static export (`output: "export"`, `trailingSlash: true`).
# Each route is a real file at <route>/index.html. Render serves an existing
# file before any rule, so /tools/break-even/ is the exported page.
# A path with no file (for example /tools/break-even without the slash) is
# rewritten to that page's index.html, not to the site root.
services:
  - type: web
    name: canyin-ai-toolkit
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The build command installs dependencies. Skip Render's automatic install.
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /*/index.html
